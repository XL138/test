<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>像素秘境：割草幸存者</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{background:#000;color:#fff;overflow:hidden;touch-action:none;user-select:none;}

/* 核心容器：正常横屏模式 */
#app{
  width: 100vw;
  height: 100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* 强制横屏模式：竖屏环境下自动90度旋转，直接显示横屏界面 */
#app.force-landscape{
  width: 100vh;
  height: 100vw;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: center center;
}

#gameCanvas{display:block;background:#223;image-rendering:pixelated;}

.ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.ui-layer > *{pointer-events:auto;}

.load-page{position:absolute;inset:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:200;}
.load-title{font-size:clamp(24px,5vw,42px);color:#7cf;font-weight:bold;letter-spacing:2px;}
.load-bar{width:min(80%,400px);height:16px;border:2px solid #7cf;border-radius:4px;overflow:hidden;}
.load-fill{height:100%;width:0%;background:#7cf;transition:width 0.2s;}

.main-menu{position:absolute;inset:0;background:rgba(10,10,26,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;}
.menu-title{font-size:clamp(26px,6vw,48px);color:#8ff;margin-bottom:12px;text-align:center;}
.menu-btn{width:min(85%,320px);padding:14px 0;font-size:18px;background:#246;border:2px solid #7cf;color:#fff;border-radius:6px;cursor:pointer;transition:0.15s;}
.menu-btn:hover{background:#369;transform:scale(1.03);}
.menu-btn:active{transform:scale(0.97);}

.modal-wrap{position:absolute;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:150;}
.modal-box{width:min(92%,460px);background:#1b1b38;border:2px solid #7cf;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;}
.modal-title{font-size:22px;text-align:center;color:#8ff;}
.modal-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.modal-btn{padding:10px 16px;border:2px solid #7cf;background:#246;color:#fff;border-radius:4px;cursor:pointer;}
.modal-btn:hover{background:#369;}

.skill-select-modal{z-index:120;}
.skill-item{width:min(220px,28vw);background:#224;border:2px solid #58a;border-radius:6px;padding:12px;cursor:pointer;transition:0.15s;}
.skill-item:hover{background:#336;border-color:#8cf;transform:scale(1.02);}
.skill-name{font-weight:bold;font-size:16px;margin-bottom:6px;color:#adf;}
.skill-desc{font-size:13px;opacity:0.85;line-height:1.4;}

.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;}
.hud > div{pointer-events:auto;}
.hud-panel{background:rgba(0,0,0,0.65);border:1px solid #58a;padding:6px 10px;border-radius:4px;font-size:14px;}
.pause-btn{padding:4px 10px;background:#246;border:1px solid #7cf;border-radius:4px;color:#fff;cursor:pointer;}

.result-stat{font-size:15px;line-height:1.8;}

.perm-upg-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #346;gap:8px;}
.perm-upg-name{flex:1;}
.perm-upg-lv{min-width:40px;text-align:right;}

.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div class="ui-layer">
    <div class="load-page" id="loadPage">
      <div class="load-title">像素秘境：割草幸存者</div>
      <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
      <div>资源加载中...</div>
    </div>

    <div class="main-menu hidden" id="mainMenu">
      <div class="menu-title">像素秘境<br>割草幸存者</div>
      <button class="menu-btn" id="btnStart">开始游戏</button>
      <button class="menu-btn" id="btnPermUpg">永久强化</button>
      <button class="menu-btn" id="btnSetting">游戏设置</button>
      <button class="menu-btn" id="btnHelp">操作说明</button>
    </div>

    <div class="hud hidden" id="hud">
      <div class="hud-panel">
        <div>HP:<span id="hudHp">100</span></div>
        <div>等级:<span id="hudLv">1</span></div>
        <div>时间:<span id="hudTime">00:00</span></div>
        <div>击杀:<span id="hudKill">0</span></div>
      </div>
      <div><button class="pause-btn" id="btnPause">暂停(ESC)</button></div>
    </div>

    <div class="modal-wrap skill-select-modal hidden" id="skillModal">
      <div class="modal-box">
        <div class="modal-title">升级！选择技能</div>
        <div class="modal-row" id="skillChoices"></div>
      </div>
    </div>

    <div class="modal-wrap hidden" id="resultModal">
      <div class="modal-box">
        <div class="modal-title">本局结束</div>
        <div class="result-stat">
          <div>生存时间：<span id="resTime">00:00</span></div>
          <div>最高等级：<span id="resLv">1</span></div>
          <div>击杀数：<span id="resKill">0</span></div>
          <div>获得秘境币：<span id="resCoin">0</span></div>
        </div>
        <div class="modal-row">
          <button class="modal-btn" id="btnReplay">再来一局</button>
          <button class="modal-btn" id="btnBackMenu">返回主界面</button>
        </div>
      </div>
    </div>

    <div class="modal-wrap hidden" id="permUpgModal">
      <div class="modal-box">
        <div class="modal-title">永久强化｜秘境币:<span id="permCoin">0</span></div>
        <div id="permUpgList"></div>
        <div class="modal-row">
          <button class="modal-btn" id="btnResetSave">重置全部存档</button>
          <button class="modal-btn" id="btnClosePerm">关闭</button>
        </div>
      </div>
    </div>

    <div class="modal-wrap hidden" id="settingModal">
      <div class="modal-box">
        <div class="modal-title">游戏设置</div>
        <div>
          <label><input type="checkbox" id="chkBgm">背景音乐</label>
        </div>
        <div>
          <label><input type="checkbox" id="chkSfx">游戏音效</label>
        </div>
        <div style="margin:8px 0;">画质：
          <select id="selQuality">
            <option value="low">低</option>
            <option value="mid" selected>中</option>
            <option value="high">高</option>
          </select>
        </div>
        <div class="modal-row"><button class="modal-btn" id="btnCloseSet">关闭</button></div>
      </div>
    </div>

    <div class="modal-wrap hidden" id="helpModal">
      <div class="modal-box">
        <div class="modal-title">操作说明</div>
        <div style="line-height:1.7;">
          <div>PC：WASD / 方向键移动，角色自动攻击</div>
          <div>手机：按住屏幕拖拽，角色向拖拽方向持续移动；松开停止</div>
          <div>ESC 暂停游戏</div>
          <div>击杀敌人拾取经验升级，三选一技能强化</div>
          <div>生存越久敌人越强，尽可能活下去！</div>
        </div>
        <div class="modal-row"><button class="modal-btn" id="btnCloseHelp">知道了</button></div>
      </div>
    </div>
  </div>
</div>

<script>
const CANVAS_ASPECT = 16 / 9;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const app = document.getElementById('app');

const dom = {
  loadPage:document.getElementById('loadPage'),
  loadFill:document.getElementById('loadFill'),
  mainMenu:document.getElementById('mainMenu'),
  hud:document.getElementById('hud'),
  skillModal:document.getElementById('skillModal'),
  skillChoices:document.getElementById('skillChoices'),
  resultModal:document.getElementById('resultModal'),
  permUpgModal:document.getElementById('permUpgModal'),
  permUpgList:document.getElementById('permUpgList'),
  settingModal:document.getElementById('settingModal'),
  helpModal:document.getElementById('helpModal'),
};

// ========== 强制横屏核心逻辑 ==========
let isForceLandscape = false;
function checkForceLandscape(){
  // 竖屏环境（高>宽）强制旋转90度，直接横屏显示
  isForceLandscape = window.innerHeight > window.innerWidth;
  if(isForceLandscape){
    app.classList.add('force-landscape');
  }else{
    app.classList.remove('force-landscape');
  }
  resizeCanvas();
}
window.addEventListener('resize', checkForceLandscape);

// ========== 本地存储 ==========
const SAVE_KEY = "pixelSurvivorSaveV6";
const defaultSave = {
  coin:0,
  permUpgrades:{hp:0,speed:0,atkSpeed:0,expBonus:0,coinBonus:0},
  record:{maxSurvive:0,maxKill:0},
  settings:{bgm:true,sfx:true,quality:'mid'}
};
let saveData = JSON.parse(JSON.stringify(defaultSave));

function loadSave(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw){
    try{ saveData = {...defaultSave, ...JSON.parse(raw)}; }catch(e){ saveData = {...defaultSave}; }
  }
  document.getElementById('chkBgm').checked = saveData.settings.bgm;
  document.getElementById('chkSfx').checked = saveData.settings.sfx;
  document.getElementById('selQuality').value = saveData.settings.quality;
}
function saveToLocal(){
  localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
}
function resetAllSave(){
  saveData = JSON.parse(JSON.stringify(defaultSave));
  saveToLocal();
  renderPermUpgradePanel();
}

class SimpleAudio{
  constructor(){ this.bgmOn = saveData.settings.bgm; this.sfxOn = saveData.settings.sfx; }
  playSfx(){ if(!this.sfxOn) return; }
  playBgm(){ if(!this.bgmOn) return; }
  stopBgm(){}
}
const audio = new SimpleAudio();

// ========== 游戏配置 ==========
const normalSkillDef = [
  {id:'multiShot',name:'多重弹道',desc:'增加同时发射攻击数量',maxLv:5},
  {id:'atkSpeed',name:'攻速强化',desc:'提升攻击发射频率',maxLv:5},
  {id:'aoe',name:'范围溅射',desc:'攻击命中附带小范围AOE伤害',maxLv:5},
  {id:'hpRegen',name:'生命回复',desc:'周期性恢复少量生命值',maxLv:5},
  {id:'moveSpeed',name:'移速提升',desc:'提高角色移动速度',maxLv:5},
  {id:'shield',name:'护盾屏障',desc:'周期性生成抵挡一次伤害的护盾',maxLv:5},
  {id:'pierce',name:'弹道穿透',desc:'攻击可穿透多个敌人',maxLv:5},
  {id:'magnet',name:'磁力吸附',desc:'扩大经验宝石拾取范围',maxLv:5},
];
const rareSkillDef = [
  {id:'slow',name:'攻击减速',desc:'攻击附带敌人减速效果'},
  {id:'killExplode',name:'击杀爆炸',desc:'击杀敌人概率触发范围爆炸'},
  {id:'expDouble',name:'全局经验翻倍',desc:'经验获取效率直接翻倍'},
  {id:'reflectDmg',name:'受伤反弹',desc:'受伤时反弹伤害给周围敌人'},
];
const enemyTypes = {
  normal:{hp:20,speed:1.2,color:'#77bb44',size:12,weight:60},
  fast:{hp:8,speed:2.4,color:'#44ddff',size:9,weight:20},
  heavy:{hp:80,speed:0.6,color:'#bb7744',size:18,weight:12},
  ranged:{hp:25,speed:0.9,color:'#dd77bb',size:13,weight:8},
  boss:{hp:600,speed:0.5,color:'#ff3333',size:32,weight:0,isBoss:true}
};

function spawnExplosion(x,y,count=12,color="#ffdd44"){
  const quality = saveData.settings.quality;
  const maxPart = quality==='low'?Math.floor(count*0.4):quality==='mid'?count:Math.floor(count*1.4);
  for(let i=0;i<maxPart;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 1 + Math.random()*3;
    gameState.particles.push({
      x,y,
      vx:Math.cos(ang)*spd,
      vy:Math.sin(ang)*spd,
      size:2+Math.random()*4,
      color,
      life:350+Math.random()*250
    })
  }
}

let screenFlash = 0;

let gameState = {
  running:false, paused:false, gameTime:0, killCount:0, maxLevel:1,
  player:null, enemies:[], bullets:[], exps:[], particles:[],
  skillLevels:{}, rareSkills:[],
  nextBossTime:300,
  quality:'mid'
};

// 触摸拖拽控制（已适配强制横屏坐标转换）
const touchControl = {
  active: false,
  startX:0, startY:0,
  currentX:0, currentY:0
};

// ========== 玩家类 ==========
class Player{
  constructor(){
    const perm = saveData.permUpgrades;
    this.x = canvas.width/2; this.y = canvas.height/2;
    const baseHp = 100 + perm.hp *12;
    this.hp = baseHp; this.maxHp = baseHp;
    this.baseSpeed = 2.2 + perm.speed *0.22;
    this.speed = this.baseSpeed;
    this.atkInterval = Math.max(180,420 - perm.atkSpeed*28);
    this.atkTimer = 0;
    this.level = 1; this.exp = 0; this.expToNext = 80;
    this.invincible = 0; this.shieldCooldown =0; this.hasShield=false;
    this.regenTimer=0; this.magnetRange=32;
    this.moveX=0;this.moveY=0;
    this.hurtFlash = 0;
  }
  update(dt){
    let spd = this.speed;
    if(gameState.skillLevels.moveSpeed) spd *= 1 + gameState.skillLevels.moveSpeed*0.14;
    const len = Math.hypot(this.moveX,this.moveY);
    if(len>0.01){
      this.x += (this.moveX/len)*spd * dt;
      this.y += (this.moveY/len)*spd * dt;
    }
    this.x = Math.max(20,Math.min(canvas.width-20,this.x));
    this.y = Math.max(20,Math.min(canvas.height-20,this.y));
    if(this.invincible>0) this.invincible -= dt;
    if(this.hurtFlash>0) this.hurtFlash -= dt;

    if(gameState.skillLevels.shield){
      this.shieldCooldown -= dt;
      if(this.shieldCooldown<=0 && !this.hasShield){
        this.hasShield=true;
        this.shieldCooldown = 4200 - gameState.skillLevels.shield*400;
      }
    }
    if(gameState.skillLevels.hpRegen){
      this.regenTimer -= dt;
      if(this.regenTimer<=0){
        this.hp += 1.2*gameState.skillLevels.hpRegen;
        this.hp = Math.min(this.maxHp,this.hp);
        this.regenTimer = 1200;
      }
    }
    this.magnetRange = 32 + (gameState.skillLevels.magnet||0)*22;
    this.atkTimer -= dt;
    if(this.atkTimer <=0){
      this.doAttack();
      let bonusSpd = gameState.skillLevels.atkSpeed||0;
      this.atkTimer = Math.max(80, this.atkInterval - bonusSpd*35);
    }
  }
  doAttack(){
    let nearest = null; let minDist=9999;
    for(const e of gameState.enemies){
      const d = Math.hypot(e.x-this.x,e.y-this.y);
      if(d<minDist){ minDist=d; nearest=e; }
    }
    if(!nearest) return;
    const angle = Math.atan2(nearest.y-this.y, nearest.x-this.x);
    const multi = 1 + (gameState.skillLevels.multiShot||0);
    const spreadRad = 0.22;
    for(let i=0;i<multi;i++){
      const offAng = angle + (i-(multi-1)/2)*spreadRad;
      gameState.bullets.push({
        x:this.x,y:this.y,
        vx:Math.cos(offAng)*7.2, vy:Math.sin(offAng)*7.2,
        pierce:gameState.skillLevels.pierce||0,
        dmg:12
      });
    }
  }
  takeDamage(amt){
    if(this.invincible>0) return;
    if(this.hasShield){ this.hasShield=false; spawnExplosion(this.x,this.y,8,"#88ffff"); return; }
    this.hp -= amt;
    this.invincible = 500;
    this.hurtFlash = 180;
    screenFlash = 80;
    if(gameState.rareSkills.includes('reflectDmg')){
      for(const e of gameState.enemies){
        const d=Math.hypot(e.x-this.x,e.y-this.y);
        if(d<90) e.hp -=8;
      }
    }
    if(this.hp<=0){ triggerGameOver(); }
  }
  addExp(val){
    let mul = 1 + saveData.permUpgrades.expBonus*0.08;
    if(gameState.rareSkills.includes('expDouble')) mul *=2;
    const real = val*mul;
    this.exp += real;
    while(this.exp >= this.expToNext){
      this.exp -= this.expToNext;
      this.level +=1;
      if(this.level>gameState.maxLevel) gameState.maxLevel=this.level;
      spawnExplosion(this.x,this.y,22,"#88ffff");
      screenFlash = 120;
      if(this.level>=30){
        this.maxHp +=4; this.hp +=4;
      }else{
        triggerSkillSelect();
      }
      this.expToNext = Math.floor(this.expToNext *1.28);
    }
  }
  draw(){
    ctx.save();
    if(this.invincible>0 && Math.floor(this.invincible/80)%2===0){ ctx.globalAlpha=0.4; }
    ctx.shadowBlur =14;
    ctx.shadowColor="#5cf";
    if(this.hurtFlash>0){
      ctx.fillStyle="#ff6666";
    }else{
      ctx.fillStyle="#44ccff";
    }
    ctx.fillRect(this.x-12,this.y-12,24,24);
    ctx.fillStyle="#224488";
    ctx.fillRect(this.x-8,this.y-8,16,16);
    ctx.fillStyle="#ffffff";
    ctx.fillRect(this.x-6,this.y-4,4,4);
    ctx.fillRect(this.x+2,this.y-4,4,4);
    ctx.shadowBlur=0;

    if(this.hasShield){
      const pulse = Math.sin(performance.now()/180)*3;
      ctx.strokeStyle="#8ff"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(this.x,this.y,22+pulse,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }
}

// ========== 敌人绘制（非球体像素造型） ==========
function drawEnemy(e){
  ctx.save();
  if(e.isBoss){
    ctx.shadowBlur=24;
    ctx.shadowColor="#ff2222";
  }else{
    ctx.shadowBlur=7;
    ctx.shadowColor=e.color;
  }
  ctx.fillStyle=e.color;
  const sz = e.size;
  switch(e.type){
    case "normal":{
      ctx.beginPath();
      ctx.moveTo(e.x, e.y-sz);
      ctx.lineTo(e.x+sz, e.y);
      ctx.lineTo(e.x, e.y+sz);
      ctx.lineTo(e.x-sz, e.y);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case "fast":{
      ctx.beginPath();
      ctx.moveTo(e.x, e.y-sz);
      ctx.lineTo(e.x+sz, e.y+sz);
      ctx.lineTo(e.x-sz, e.y+sz);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case "heavy":{
      ctx.fillRect(e.x-sz,e.y-sz,sz*2,sz*2);
      ctx.fillStyle="#774422";
      ctx.fillRect(e.x-sz*0.6,e.y-sz*0.6,sz*1.2,sz*1.2);
      break;
    }
    case "ranged":{
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const ang = Math.PI*2/5*i - Math.PI/2;
        const px = e.x + Math.cos(ang)*sz;
        const py = e.y + Math.sin(ang)*sz;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      break;
    }
    case "boss":{
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const ang = Math.PI*2/8*i;
        const px = e.x + Math.cos(ang)*sz;
        const py = e.y + Math.sin(ang)*sz;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle="rgba(255,60,60,0.45)";
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(e.x,e.y,e.size+14,0,Math.PI*2);ctx.stroke();
      break;
    }
  }
  ctx.shadowBlur=0;
  const hpRatio = e.hp/e.maxHp;
  ctx.fillStyle="#222"; ctx.fillRect(e.x-e.size, e.y-e.size-8, e.size*2,4);
  ctx.fillStyle= hpRatio>0.5?"#4f4":hpRatio>0.2?"#ffaa22":"#ee3333";
  ctx.fillRect(e.x-e.size, e.y-e.size-8, e.size*2*hpRatio,4);
  ctx.restore();
}

function spawnEnemy(){
  const gt = gameState.gameTime /1000;
  const pool = [];
  for(const [k,def] of Object.entries(enemyTypes)){
    if(k==='boss') continue;
    for(let i=0;i<def.weight;i++) pool.push(k);
  }
  const typeKey = pool[Math.floor(Math.random()*pool.length)];
  const def = enemyTypes[typeKey];
  let x,y;
  const side = Math.floor(Math.random()*4);
  if(side===0){x=-20;y=Math.random()*canvas.height;}
  else if(side===1){x=canvas.width+20;y=Math.random()*canvas.height;}
  else if(side===2){x=Math.random()*canvas.width;y=-20;}
  else{x=Math.random()*canvas.width;y=canvas.height+20;}
  const timeScale = 1 + gt*0.014;
  gameState.enemies.push({
    x,y,hp:def.hp*timeScale,maxHp:def.hp*timeScale,
    speed:def.speed,color:def.color,size:def.size,type:typeKey,slowTimer:0
  });
}
function spawnBoss(){
  const def = enemyTypes.boss;
  gameState.enemies.push({
    x:-40,y:canvas.height/2,hp:def.hp,maxHp:def.hp,
    speed:def.speed,color:def.color,size:def.size,type:'boss',slowTimer:0,isBoss:true
  });
}

function triggerSkillSelect(){
  gameState.paused = true;
  dom.skillModal.classList.remove('hidden');
  dom.skillChoices.innerHTML = '';
  const shuffled = [...normalSkillDef].sort(()=>Math.random()-0.5);
  const picks = shuffled.slice(0,3);
  picks.forEach(sk=>{
    const div = document.createElement('div');
    div.className = 'skill-item';
    const currLv = gameState.skillLevels[sk.id]||0;
    const canUp = currLv < sk.maxLv;
    div.innerHTML = `<div class="skill-name">${sk.name} Lv.${currLv}/${sk.maxLv}</div><div class="skill-desc">${sk.desc}</div>`;
    div.onclick = ()=>{
      if(!canUp) return;
      gameState.skillLevels[sk.id] = currLv+1;
      dom.skillModal.classList.add('hidden');
      gameState.paused = false;
    };
    dom.skillChoices.appendChild(div);
  });
}
function triggerRareSkillSelect(){
  gameState.paused = true;
  dom.skillModal.classList.remove('hidden');
  dom.skillChoices.innerHTML='';
  const shuffled = [...rareSkillDef].sort(()=>Math.random()-0.5);
  const picks = shuffled.slice(0,3);
  picks.forEach(sk=>{
    const div = document.createElement('div');
    div.className='skill-item';
    const owned = gameState.rareSkills.includes(sk.id);
    div.innerHTML=`<div class="skill-name">${sk.name} ${owned?'【已拥有】':''}</div><div class="skill-desc">${sk.desc}</div>`;
    div.onclick=()=>{
      if(!owned) gameState.rareSkills.push(sk.id);
      dom.skillModal.classList.add('hidden');
      gameState.paused=false;
    };
    dom.skillChoices.appendChild(div);
  })
}

// ========== 游戏主循环 ==========
let lastTs = 0;
function gameLoop(ts){
  requestAnimationFrame(gameLoop);
  if(!gameState.running) return;
  const dt = Math.min(50, ts-lastTs||16);
  lastTs = ts;
  if(gameState.paused) return;
  gameState.gameTime += dt;
  const player = gameState.player;

  // ===== 触摸输入坐标转换（适配强制横屏）=====
  if(touchControl.active){
    let dx = touchControl.currentX - touchControl.startX;
    let dy = touchControl.currentY - touchControl.startY;
    if(isForceLandscape){
      // 旋转90度顺时针，输入坐标逆旋转90度匹配游戏坐标系
      const newDx = dy;
      const newDy = -dx;
      player.moveX = newDx;
      player.moveY = newDy;
    }else{
      player.moveX = dx;
      player.moveY = dy;
    }
  }else{
    player.moveX=0;
    player.moveY=0;
  }

  // BOSS刷新
  if(gameState.gameTime >= gameState.nextBossTime*1000){
    spawnBoss();
    gameState.nextBossTime +=300;
  }

  // 敌人生成
  const sec = gameState.gameTime/1000;
  const spawnRate = Math.max(220, 1100 - sec*7);
  if(Math.random() < dt/spawnRate) spawnEnemy();

  player.update(dt);

  // 敌人更新
  for(let i=gameState.enemies.length-1;i>=0;i--){
    const e = gameState.enemies[i];
    const dx = player.x - e.x; const dy = player.y - e.y;
    const dist = Math.hypot(dx,dy);
    let spd = e.speed;
    if(e.slowTimer>0){ spd *=0.4; e.slowTimer -=dt; }
    if(dist>1){
      e.x += (dx/dist)*spd * dt*0.06;
      e.y += (dy/dist)*spd * dt*0.06;
    }
    if(dist < e.size+12){
      player.takeDamage(6);
    }
    if(e.hp<=0){
      const expAmt = e.isBoss ? 220 : (e.type==='heavy'?22:8);
      const particleColor = e.isBoss?"#ff4444":"#88dd66";
      spawnExplosion(e.x,e.y,e.isBoss?35:10,particleColor);
      for(let k=0;k<(e.isBoss?12:1);k++){
        gameState.exps.push({x:e.x+(Math.random()-0.5)*12,y:e.y+(Math.random()-0.5)*12,val:expAmt/(e.isBoss?12:1)});
      }
      gameState.killCount +=1;
      if(e.isBoss) setTimeout(()=>triggerRareSkillSelect(),100);
      if(gameState.rareSkills.includes('killExplode') && Math.random()<0.28){
        for(const oe of gameState.enemies){
          const d2=Math.hypot(oe.x-e.x,oe.y-e.y);
          if(d2<70) oe.hp -=25;
        }
      }
      gameState.enemies.splice(i,1);
    }
  }

  // 子弹更新
  for(let i=gameState.bullets.length-1;i>=0;i--){
    const b = gameState.bullets[i];
    b.x += b.vx*dt*0.06; b.y += b.vy*dt*0.06;
    if(b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height){
      gameState.bullets.splice(i,1); continue;
    }
    for(let j=gameState.enemies.length-1;j>=0;j--){
      const e = gameState.enemies[j];
      const d = Math.hypot(b.x-e.x,b.y-e.y);
      if(d<e.size){
        e.hp -= b.dmg;
        if(gameState.rareSkills.includes('slow')) e.slowTimer=1400;
        if(gameState.skillLevels.aoe){
          const aoeR = 24 + gameState.skillLevels.aoe*8;
          for(const oe of gameState.enemies){
            if(oe===e) continue;
            const ad = Math.hypot(oe.x-b.x,oe.y-b.y);
            if(ad<aoeR) oe.hp -= b.dmg*0.45;
          }
        }
        b.pierce -=1;
        if(b.pierce<0){
          gameState.bullets.splice(i,1);
        }
        break;
      }
    }
  }

  // 经验拾取
  for(let i=gameState.exps.length-1;i>=0;i--){
    const ex = gameState.exps[i];
    const d = Math.hypot(ex.x-player.x, ex.y-player.y);
    if(d < player.magnetRange){
      spawnExplosion(ex.x,ex.y,4,"#ffdd44");
      player.addExp(ex.val);
      gameState.exps.splice(i,1);
    }
  }

  // 粒子更新
  gameState.particles = gameState.particles.filter(p=>{
    p.life -=dt;
    p.x += p.vx*dt*0.04; p.y += p.vy*dt*0.04;
    return p.life>0;
  });

  // ========== 渲染 ==========
  ctx.fillStyle="#182030";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // 背景星空
  ctx.fillStyle="rgba(255,255,255,0.08)";
  for(let s=0;s<40;s++){
    const sx = (s*137+ts*0.005) % canvas.width;
    const sy = (s*89) % canvas.height;
    ctx.fillRect(sx,sy,1,1);
  }

  // 经验宝石
  for(const ex of gameState.exps){
    const pulse = Math.sin(ts/120)*1.5;
    ctx.save();
    ctx.shadowBlur=8;
    ctx.shadowColor="#ffdd44";
    ctx.fillStyle="#ffdd44";
    ctx.beginPath(); ctx.arc(ex.x,ex.y,5+pulse,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }

  // 敌人
  for(const e of gameState.enemies){
    drawEnemy(e);
  }

  // 子弹
  ctx.fillStyle="#aff";
  for(const b of gameState.bullets){
    ctx.save();
    ctx.shadowBlur=10;
    ctx.shadowColor="#aaffff";
    ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }

  // 粒子
  for(const p of gameState.particles){
    ctx.save();
    ctx.globalAlpha = p.life/550;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  player.draw();

  // 屏幕闪光
  if(screenFlash>0){
    ctx.fillStyle=`rgba(255,80,80,${screenFlash/220})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    screenFlash -= dt;
  }

  // HUD更新
  document.getElementById('hudHp').innerText = Math.floor(player.hp);
  document.getElementById('hudLv').innerText = player.level;
  const s = Math.floor(gameState.gameTime/1000);
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  document.getElementById('hudTime').innerText = `${mm}:${ss}`;
  document.getElementById('hudKill').innerText = gameState.killCount;
}

function triggerGameOver(){
  gameState.running = false;
  const surviveSec = Math.floor(gameState.gameTime/1000);
  const baseCoin = Math.floor((surviveSec*0.22 + gameState.killCount*0.32)*(1+saveData.permUpgrades.coinBonus*0.12));
  saveData.coin += baseCoin;
  if(surviveSec>saveData.record.maxSurvive) saveData.record.maxSurvive=surviveSec;
  if(gameState.killCount>saveData.record.maxKill) saveData.record.maxKill=gameState.killCount;
  saveToLocal();

  const s = surviveSec;
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  document.getElementById('resTime').innerText = `${mm}:${ss}`;
  document.getElementById('resLv').innerText = gameState.maxLevel;
  document.getElementById('resKill').innerText = gameState.killCount;
  document.getElementById('resCoin').innerText = baseCoin;
  dom.resultModal.classList.remove('hidden');
}

function startNewGame(){
  gameState = {
    running:true, paused:false, gameTime:0, killCount:0, maxLevel:1,
    player:new Player(), enemies:[], bullets:[], exps:[], particles:[],
    skillLevels:{}, rareSkills:[], nextBossTime:300,
    quality:saveData.settings.quality
  };
  screenFlash=0;
  touchControl.active = false;
  dom.mainMenu.classList.add('hidden');
  dom.resultModal.classList.add('hidden');
  dom.hud.classList.remove('hidden');
  lastTs = performance.now();
}

// ========== 输入控制 ==========
// 键盘
const keys = {};
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Escape' && gameState.running){
    togglePause();
  }
});
window.addEventListener('keyup',e=>keys[e.code]=false);

// 画布触摸事件
canvas.addEventListener('touchstart',(ev)=>{
  if(!gameState.running || gameState.paused) return;
  ev.preventDefault();
  const t = ev.touches[0];
  touchControl.active = true;
  touchControl.startX = t.clientX;
  touchControl.startY = t.clientY;
  touchControl.currentX = touchControl.startX;
  touchControl.currentY = touchControl.startY;
})
canvas.addEventListener('touchmove',(ev)=>{
  if(!touchControl.active || !gameState.running) return;
  ev.preventDefault();
  const t = ev.touches[0];
  touchControl.currentX = t.clientX;
  touchControl.currentY = t.clientY;
})
canvas.addEventListener('touchend',()=>{ touchControl.active = false; })
canvas.addEventListener('touchcancel',()=>{ touchControl.active = false; })

// 键盘输入轮询
function pollInput(){
  if(!gameState.running || !gameState.player) return;
  let mx=0,my=0;
  if(keys['KeyW']||keys['ArrowUp']) my -=60;
  if(keys['KeyS']||keys['ArrowDown']) my +=60;
  if(keys['KeyA']||keys['ArrowLeft']) mx -=60;
  if(keys['KeyD']||keys['ArrowRight']) mx +=60;
  if(Math.abs(mx)+Math.abs(my)>0){
    gameState.player.moveX = mx;
    gameState.player.moveY = my;
  }
}
setInterval(pollInput,16);

function togglePause(){
  if(!gameState.running) return;
  gameState.paused = !gameState.paused;
}

// 失焦自动暂停
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && gameState.running){
    gameState.paused = true;
  }
});

// ========== UI事件 ==========
document.getElementById('btnStart').onclick = ()=>startNewGame();
document.getElementById('btnPermUpg').onclick = ()=>{ renderPermUpgradePanel(); dom.permUpgModal.classList.remove('hidden'); };
document.getElementById('btnClosePerm').onclick = ()=>dom.permUpgModal.classList.add('hidden');
document.getElementById('btnSetting').onclick = ()=>dom.settingModal.classList.remove('hidden');
document.getElementById('btnCloseSet').onclick = ()=>dom.settingModal.classList.add('hidden');
document.getElementById('btnHelp').onclick = ()=>dom.helpModal.classList.remove('hidden');
document.getElementById('btnCloseHelp').onclick = ()=>dom.helpModal.classList.add('hidden');
document.getElementById('btnPause').onclick = togglePause;

document.getElementById('btnReplay').onclick = ()=>{ dom.resultModal.classList.add('hidden'); startNewGame(); };
document.getElementById('btnBackMenu').onclick = ()=>{ dom.resultModal.classList.add('hidden'); dom.mainMenu.classList.remove('hidden'); };

document.getElementById('btnResetSave').onclick = ()=>{
  if(confirm('确定要清空全部本地存档数据，此操作不可恢复？')) resetAllSave();
};

document.getElementById('chkBgm').onchange = e=>{ saveData.settings.bgm = e.target.checked; saveToLocal(); };
document.getElementById('chkSfx').onchange = e=>{ saveData.settings.sfx = e.target.checked; saveToLocal(); };
document.getElementById('selQuality').onchange = e=>{ saveData.settings.quality = e.target.value; saveToLocal(); };

// ========== 永久强化面板 ==========
const permUpgMeta = [
  {key:'hp',name:'初始生命值',costBase:22},
  {key:'speed',name:'初始移速',costBase:28},
  {key:'atkSpeed',name:'初始攻速',costBase:32},
  {key:'expBonus',name:'经验获取加成',costBase:36},
  {key:'coinBonus',name:'秘境币加成',costBase:40},
];
function renderPermUpgradePanel(){
  document.getElementById('permCoin').innerText = saveData.coin;
  dom.permUpgList.innerHTML='';
  for(const meta of permUpgMeta){
    const lv = saveData.permUpgrades[meta.key];
    const maxLv=10;
    const cost = Math.floor(meta.costBase * Math.pow(1.42, lv));
    const canBuy = lv<maxLv && saveData.coin >= cost;
    const div = document.createElement('div');
    div.className='perm-upg-item';
    div.innerHTML = `
      <div class="perm-upg-name">${meta.name}</div>
      <div class="perm-upg-lv">Lv.${lv}/${maxLv}</div>
      <button class="modal-btn" ${!canBuy?'disabled':''}>${lv>=maxLv?'已满':cost+'币'}</button>
    `;
    const btn = div.querySelector('button');
    if(lv<maxLv){
      btn.onclick=()=>{
        if(saveData.coin>=cost){
          saveData.coin -= cost;
          saveData.permUpgrades[meta.key] +=1;
          saveToLocal();
          renderPermUpgradePanel();
        }
      }
    }
    dom.permUpgList.appendChild(div);
  }
}

// ========== Canvas自适应 ==========
function resizeCanvas(){
  let w = app.clientWidth;
  let h = app.clientHeight;
  let cw,ch;
  if(w/h > CANVAS_ASPECT){
    ch = h; cw = h * CANVAS_ASPECT;
  }else{
    cw = w; ch = w / CANVAS_ASPECT;
  }
  canvas.width = Math.floor(cw);
  canvas.height = Math.floor(ch);
  canvas.style.width = cw+'px';
  canvas.style.height = ch+'px';
}

// ========== 启动 ==========
async function boot(){
  loadSave();
  checkForceLandscape(); // 启动即检测并强制横屏
  for(let p=0;p<=100;p+=8){
    dom.loadFill.style.width = p+'%';
    await new Promise(r=>setTimeout(r,40));
  }
  await new Promise(r=>setTimeout(r,200));
  dom.loadPage.classList.add('hidden');
  dom.mainMenu.classList.remove('hidden');
  requestAnimationFrame(gameLoop);
}
boot();
</script>
