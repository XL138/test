<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>像素秘境：割草幸存者 V4.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    font-family:"Courier New", Consolas, monospace;
    user-select:none; -webkit-user-select:none; touch-action:none;
    -webkit-tap-highlight-color: transparent;
  }
  #game-root { position:fixed; top:0; left:0; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#000; }
  /* 始终按 16:9 等比缩放铺满可见区域：横屏适配，任意方向都不变形、不超框 */
  #game-container { position:relative; aspect-ratio:16/9; width:min(100vw, calc(100vh * 16 / 9)); height:min(100vh, calc(100vw * 9 / 16)); overflow:hidden; transform-origin:center center; }
  #game-canvas { width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }

  /* 保留旋转提示 DOM 但默认隐藏：不再强制提醒用户横屏 */
  #rotate-tip { display:none !important; }

  .ui-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  .ui-layer > * { pointer-events:auto; }

  /* HUD */
  #hud { position:absolute; top:0; left:0; width:100%; padding:12px 18px; color:#fff; font-size:14px; display:none; pointer-events:none; }
  #hud .row { display:flex; align-items:center; gap:14px; }
  .hp-wrap { display:flex; align-items:center; gap:8px; }
  .hp-bar { width:200px; height:15px; background:rgba(0,0,0,.55); border:2px solid #fff; }
  .hp-fill { height:100%; background:#e74c3c; transition:width .15s; }
  .stat { background:rgba(0,0,0,.45); padding:2px 9px; border:1px solid rgba(255,255,255,.5); }
  #exp-bar-wrap { position:absolute; left:18px; top:42px; width:220px; height:9px; background:rgba(0,0,0,.5); border:1px solid #aaa; }
  #exp-fill { height:100%; background:#FFD740; width:0%; transition:width .15s; }
  #boss-warn { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#FF3B3B; font-size:34px; font-weight:bold; text-shadow:0 0 8px #ff0000; opacity:0; transition:opacity .4s; pointer-events:none; }

  /* 小地图 + 气候 */
  #minimap-wrap { position:absolute; top:12px; right:14px; width:214px; text-align:right; pointer-events:none; }
  #minimap { width:214px; height:134px; background:rgba(6,10,18,.72); border:2px solid rgba(255,255,255,.6); image-rendering:pixelated; cursor:zoom-in; pointer-events:auto; }
  #minimap-label { display:inline-block; margin-top:4px; padding:2px 10px; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.35); font-size:12px; color:#FFD740; letter-spacing:1px; }
  #minimap-hint { font-size:10px; color:#889; margin-top:2px; }
  #btn-map { position:absolute; left:-46px; top:40px; width:42px; height:42px; background:rgba(0,0,0,.55); border:2px solid #FFD740; color:#FFD740; font-size:20px; cursor:pointer; pointer-events:auto; line-height:38px; text-align:center; }

  /* 物品/拾取 说明浮层 */
  #tooltip { position:absolute; display:none; min-width:180px; max-width:260px; padding:10px 12px; background:rgba(10,12,20,.92); border:2px solid #FFD740; color:#fff; font-size:13px; line-height:1.6; pointer-events:none; z-index:30; box-shadow:0 0 18px rgba(255,215,64,.35); }
  #tooltip .tt-name { color:#FFD740; font-size:15px; font-weight:bold; margin-bottom:4px; }
  #tooltip .tt-kind { color:#9ad; font-size:11px; margin-bottom:4px; }

  /* 剧情 */
  #skip-btn { position:absolute; right:22px; bottom:22px; padding:10px 22px; background:rgba(0,0,0,.6); border:2px solid #fff; color:#fff; font-size:16px; cursor:pointer; display:none; min-width:48px; min-height:48px; }
  #subtitle-layer { position:absolute; bottom:96px; left:50%; transform:translateX(-50%); max-width:78%; padding:10px 22px; background:rgba(0,0,0,.75); color:#fff; font-size:21px; text-align:center; line-height:1.7; display:none; letter-spacing:1px; border-left:3px solid #FFD740; }
  #story-next-btn { position:absolute; bottom:26px; left:50%; transform:translateX(-50%); padding:12px 30px; background:rgba(255,215,64,.18); border:2px solid #FFD740; color:#FFD740; font-size:17px; cursor:pointer; display:none; letter-spacing:3px; animation:npulse 1.1s infinite; }
  @keyframes npulse { 0%,100%{ box-shadow:0 0 6px rgba(255,215,64,.4);} 50%{ box-shadow:0 0 22px rgba(255,215,64,.9);} }

  /* 摇杆 */
  #joystick { position:absolute; left:44px; bottom:44px; width:150px; height:150px; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.35); border-radius:50%; display:none; }
  #joystick-thumb { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:58px; height:58px; background:rgba(255,255,255,.5); border-radius:50%; }
  #pause-btn { position:absolute; right:20px; bottom:20px; width:56px; height:56px; background:rgba(0,0,0,.5); border:2px solid #fff; color:#fff; font-size:24px; cursor:pointer; display:none; }

  /* 全屏界面层 */
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(8,10,18,.94); color:#fff; z-index:20; }
  .screen.show { display:flex; }
  .screen h1 { font-size:34px; letter-spacing:4px; margin-bottom:8px; color:#FFD740; text-shadow:0 0 12px rgba(255,215,64,.5); }
  .screen h2 { font-size:22px; letter-spacing:2px; margin-bottom:14px; color:#fff; }
  .screen .sub { color:#9aa; font-size:14px; margin-bottom:18px; }
  .btn { min-width:200px; min-height:50px; margin:7px; padding:10px 24px; background:rgba(255,255,255,.08); border:2px solid #fff; color:#fff; font-size:16px; cursor:pointer; font-family:inherit; letter-spacing:2px; }
  .btn:hover { background:rgba(255,215,64,.2); border-color:#FFD740; color:#FFD740; }
  .btn.gold { border-color:#FFD740; color:#FFD740; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-sm { min-width:120px; min-height:44px; font-size:13px; }
  .row2 { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  /* 升级三选一 */
  .upgrade-card { width:225px; min-height:185px; margin:10px; padding:16px; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.4); cursor:pointer; text-align:center; }
  .upgrade-card:hover { border-color:#FFD740; transform:scale(1.03); }
  .upgrade-card .uc-name { font-size:18px; margin-bottom:10px; }
  .upgrade-card .uc-desc { font-size:13px; color:#bbb; line-height:1.5; min-height:70px; }
  .uc-tier-normal { color:#ddd; } .uc-tier-rare { color:#6ab7ff; } .uc-tier-relic { color:#ff8ad4; }

  /* 英雄卡 */
  .hero-card { width:200px; margin:9px; padding:12px; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.4); cursor:pointer; text-align:center; }
  .hero-card .hc-name { font-size:16px; margin-bottom:5px; color:#FFD740; }
  .hero-card .hc-desc { font-size:12px; color:#bbb; line-height:1.5; min-height:58px; }
  .hero-card.locked { opacity:.55; }
  .hero-card canvas { image-rendering:pixelated; }

  /* 武器卡 */
  .weapon-card { width:180px; margin:8px; padding:12px; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.35); cursor:pointer; text-align:center; }
  .weapon-card:hover { border-color:#FFD740; transform:scale(1.03); }
  .weapon-card .wc-name { font-size:15px; margin-bottom:5px; color:#6ec6ff; }
  .weapon-card .wc-desc { font-size:11px; color:#bbb; line-height:1.5; min-height:50px; }
  .weapon-card.locked { opacity:.5; }
  .weapon-card .wc-icon { width:44px; height:44px; margin:0 auto 6px; image-rendering:pixelated; }

  /* 区域卡 */
  .region-card { width:230px; margin:9px; padding:14px; background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.3); cursor:pointer; text-align:center; position:relative; }
  .region-card:hover { transform:scale(1.03); }
  .region-card .rc-name { font-size:17px; margin-bottom:6px; }
  .region-card .rc-meta { font-size:12px; color:#bbb; line-height:1.7; }
  .region-card .rc-boss { font-size:12px; color:#ff8a80; margin-top:6px; }
  .region-card.locked { opacity:.5; }
  .region-card .rc-lock { position:absolute; top:8px; right:10px; font-size:18px; }
  .region-card .rc-cur { position:absolute; top:8px; left:10px; font-size:14px; color:#FFD740; animation:npulse 1.2s infinite; }
  .region-card .rc-done { position:absolute; top:8px; left:10px; font-size:14px; color:#4caf50; }

  /* 完整地图弹层 */
  #screen-fullmap { z-index:26; }
  #fullmap-canvas { width:920px; height:560px; background:rgba(6,8,16,.9); border:2px solid rgba(255,255,255,.35); image-rendering:pixelated; cursor:pointer; }
  #fullmap-info { position:absolute; left:50%; top:70%; transform:translateX(-50%); width:640px; min-height:78px; padding:10px 16px; background:rgba(0,0,0,.85); border:2px solid #FFD740; text-align:center; font-size:14px; line-height:1.7; color:#fff; pointer-events:none; }
  #fullmap-info b { color:#FFD740; }

  /* 出战准备 */
  .prep-row { display:flex; align-items:center; gap:14px; width:640px; justify-content:space-between; margin:8px 0; font-size:15px; }
  .prep-row .lbl { color:#9aa; min-width:60px; }
  .prep-tags { display:flex; gap:8px; flex-wrap:wrap; }
  .prep-tags button { min-width:90px; min-height:42px; background:rgba(255,255,255,.07); border:2px solid #555; color:#ccc; cursor:pointer; font-family:inherit; font-size:13px; }
  .prep-tags button.on { border-color:#FFD740; color:#FFD740; background:rgba(255,215,64,.12); }
  .prep-tags button.locked { opacity:.4; cursor:not-allowed; }

  .settle-stats { font-size:15px; line-height:2; color:#ddd; text-align:center; }
  .settle-stats b { color:#FFD740; font-size:20px; }
  .toast { position:absolute; top:24%; left:50%; transform:translateX(-50%); color:#FFD740; font-size:26px; font-weight:bold; opacity:0; transition:opacity .4s; pointer-events:none; text-shadow:0 0 10px rgba(255,215,64,.6); }

  .settings-row { display:flex; align-items:center; gap:14px; margin:9px; font-size:15px; width:340px; justify-content:space-between; }
  .seg { display:flex; gap:6px; }
  .seg button { min-width:62px; min-height:42px; background:rgba(255,255,255,.08); border:2px solid #555; color:#ccc; cursor:pointer; font-family:inherit; }
  .seg button.on { border-color:#FFD740; color:#FFD740; }
  .mute-note { color:#889; font-size:12px; margin-top:6px; max-width:600px; text-align:center; line-height:1.6; }
  #shop-extra { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
</style>
</head>
<body>
  
  <div id="rotate-tip"><div class="ico">📱</div><div>请旋转设备至横屏</div><div style="font-size:14px;color:#889">横屏后自动进入游戏</div></div>

  <div id="game-root">

<script>
"use strict";
// ============================================================
// RULESET_ID: pixel-secret-v4.0  共享配置源
// ============================================================
const RULESET_ID = 'pixel-secret-v4.0';

// ---- 本地资源配置（部署前配置，零外网请求）----
const ASSETS_CONFIG = {
  audio: {
    bgm: { story: 'assets/audio/bgm/story_main.mp3', game: 'assets/audio/bgm/game_main.mp3' },
    sfx: { click: 'assets/audio/sfx/click.mp3', hurt: 'assets/audio/sfx/hurt.mp3', levelup: 'assets/audio/sfx/levelup.mp3', coin: 'assets/audio/sfx/coin.mp3', boss: 'assets/audio/sfx/boss.mp3',
      shoot: 'assets/audio/sfx/shoot.mp3', break: 'assets/audio/sfx/break.mp3', ice: 'assets/audio/sfx/ice.mp3', thunder: 'assets/audio/sfx/thunder.mp3', fire: 'assets/audio/sfx/fire.mp3', pick: 'assets/audio/sfx/pick.mp3', clear: 'assets/audio/sfx/region_clear.mp3' },

// ---- 全局参数（与策划参数表同源）----

// ---- 六大区域（气候 / BOSS / 关卡难度）----

const Utils = {
  isMobile(){ return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent); },
  isPortrait(){ return window.innerHeight > window.innerWidth; },
  rnd(a,b){ return Math.random()*(b-a)+a; },
  rndInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; },
  clamp(v,a,b){ return v<a?a:(v>b?b:v); },
  dist(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return Math.sqrt(dx*dx+dy*dy); },
  rr(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; },
  pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; },
  storage:{
    get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  }
};

// ============================================================
// 渲染核心（像素无抗锯齿 + 镜头矩阵）
// ============================================================
class Renderer {
  constructor(canvas){
    this.canvas=canvas; this.ctx=canvas.getContext('2d');
    this.W=CONFIG.W; this.H=CONFIG.H;
    this.canvas.width=this.W; this.canvas.height=this.H;
    const c=this.ctx; c.imageSmoothingEnabled=false; c.webkitImageSmoothingEnabled=false;
    this.cam={x:0,y:0,scale:1,alpha:1};
    this.cache=new Map();
    this.flash=0; this.shake=0;
  }
  camPush(){ const c=this.ctx; c.save(); c.globalAlpha=this.cam.alpha;
    c.translate(this.W/2,this.H/2); c.scale(this.cam.scale,this.cam.scale);
    c.translate(-this.W/2-this.cam.x+(this.shake>0?Utils.rnd(-this.shake,this.shake):0), -this.H/2-this.cam.y+(this.shake>0?Utils.rnd(-this.shake,this.shake):0)); }
  camPop(){ this.ctx.restore(); }
  clear(){ this.ctx.fillStyle='#000'; this.ctx.fillRect(0,0,this.W,this.H); }
  sprite(key,w,h,draw){ if(this.cache.has(key)) return this.cache.get(key);
    const o=document.createElement('canvas'); o.width=w; o.height=h; const c=o.getContext('2d');
    c.imageSmoothingEnabled=false; draw(c); this.cache.set(key,o); return o; }
}

// ============================================================
// 强制横屏适配（进入即横屏展示，不再提示用户旋转）
// ============================================================
class ScreenManager {
  constructor(){ this.rotated=false; this.onChange=null;
    this.update(); window.addEventListener('resize',()=>this.update());
    window.addEventListener('orientationchange',()=>this.update()); }
  update(){
    // 不做旋转、不做提示：页面始终按 16:9 等比居中展示，用户自行横持手机
    this.rotated=false;
    document.getElementById('rotate-tip').style.display='none';
    if(this.onChange) this.onChange(false);
  }
  map(x,y){ return {x,y}; }
}

// ============================================================
// 音频管理（bgm / sfx / voice / climate，缺失自动静音）
// ============================================================
class AudioManager {
  constructor(){ this.sound=Utils.storage.get(CONFIG.STORAGE.SOUND,true); this.voiceOn=Utils.storage.get(CONFIG.STORAGE.VOICE,true); this.climateOn=Utils.storage.get(CONFIG.STORAGE.CLIMATE,true);
    this.bgmNow=null; this.climateNow=null; this.voiceNow=null; this.bgmVol=0.4; this.sfxVol=0.5; this.voiceVol=1; this.climateVol=0.35; }
  setSound(v){ this.sound=v; Utils.storage.set(CONFIG.STORAGE.SOUND,v); if(!v){ this.stopBgm(); this.stopClimate(); } }
  setVoice(v){ this.voiceOn=v; Utils.storage.set(CONFIG.STORAGE.VOICE,v); }
  setClimate(v){ this.climateOn=v; Utils.storage.set(CONFIG.STORAGE.CLIMATE,v); if(!v) this.stopClimate(); }
  play(path,vol,loop=false){ if(!this.sound&&!path.includes('voice')) return; const a=new Audio(path); a.volume=vol; a.loop=loop; a.play().catch(()=>{}); return a; }
  bgm(key){ if(!this.sound) return; if(this.bgmNow) this.stopBgm(); const p=ASSETS_CONFIG.audio.bgm[key]; if(!p) return; this.bgmNow=this.play(p,this.bgmVol,true); }
  stopBgm(){ if(this.bgmNow){ this.bgmNow.pause(); this.bgmNow.currentTime=0; this.bgmNow=null; } }
  sfx(name){ if(!this.sound) return; const p=ASSETS_CONFIG.audio.sfx[name]; if(p) this.play(p,this.sfxVol); }
  voice(key){ if(!this.voiceOn) return; const p=ASSETS_CONFIG.audio.voice[key]; if(p){ this.stopVoice(); this.voiceNow=this.play(p,this.voiceVol); } }
  stopVoice(){ if(this.voiceNow){ this.voiceNow.pause(); this.voiceNow.currentTime=0; this.voiceNow=null; } }
  // 气候环境音：按区域循环播放，缺失自动跳过
  playClimate(key){ if(!this.climateOn) return; const p=ASSETS_CONFIG.audio.climate[key]; if(!p){ this.stopClimate(); return; }
    if(this.climateNow && this.climateKey===key) return;
    if(this.climateNow) this.stopClimate();
    this.climateNow=this.play(p,this.climateVol,true); this.climateKey=key; }
  stopClimate(){ if(this.climateNow){ try{ this.climateNow.pause(); }catch(e){} this.climateNow=null; } this.climateKey=null; }
}

// 粒子系统（三档画质 + 天气 + 伤害数字 + 闪电）
// ============================================================
class ParticleSystem {
  constructor(r, quality){ this.r=r; this.list=[]; this.pool=[]; this.setQuality(quality); this.weather=[]; }
  setQuality(q){ this.mult = CONFIG.QUALITY[q] || 1; this.q = q; }
  count(cfg){ if(this.q==='HIGH') return cfg.high; if(this.q==='MEDIUM') return cfg.med; return cfg.low; }
  spawn(x,y,cfg,vx,vy){ const n=this.count(cfg); for(let i=0;i<n;i++){
    let p=this.pool.pop(); if(!p) p={x:0,y:0,vx:0,vy:0,c:'#fff',life:0,max:1,s:2};
    const ang=Math.random()*Math.PI*2, sp=(vx!==undefined)?Utils.rnd(vx*0.6,vx):Utils.rnd(10,cfg.speed);
    p.x=x; p.y=y; p.vx=(vx!==undefined)?Utils.rnd(-vx,vx):Math.cos(ang)*sp; p.vy=(vy!==undefined)?Utils.rnd(-vy,vy):Math.sin(ang)*sp;
    p.c=Utils.pick(cfg.colors); p.max=cfg.life*(0.7+Math.random()*0.6); p.life=p.max; p.s=(Math.random()<0.3?3:2); this.list.push(p); } }
  ring(x,y,color){ const p=this.pool.pop()||{type:'ring',x:0,y:0,rad:4,max:1,life:1}; p.type='ring'; p.x=x; p.y=y; p.rad=6; p.c=color; p.max=CONFIG.PARTICLES.shield.life; p.life=p.max; this.list.push(p); }
  // 伤害数字
  dmg(x,y,val,color,crit){ const p={type:'dmg',x:x,y:y,vy:-46,life:0.9,max:0.9,txt:(crit?'暴击 ':'')+Math.round(val),c:color||'#fff',s:crit?18:13}; this.list.push(p); }
  // 闪电链
  bolt(x1,y1,x2,y2,color){ this.list.push({type:'bolt',x1,y1,x2,y2,c:color||'#FFE082',life:0.14,max:0.14}); }
  // 天气粒子（按区域主题）
  weatherSpawn(theme){
    const n=this.q==='HIGH'?3:(this.q==='MEDIUM'?2:1);
    for(let i=0;i<n;i++){
      let p={x:Utils.rnd(0,this.r.W), y:Utils.rnd(0,this.r.H), vx:0,vy:0,life:1,max:1,s:2,c:'#fff',theme:theme};
      const W=this.r.W,H=this.r.H;
      if(theme==='leaf'){ p.c='#7CB342'; p.x=Utils.rnd(0,W); p.y=Utils.rnd(-20,H); p.vx=Utils.rnd(-14,14); p.vy=Utils.rnd(30,60); p.s=3; }
      else if(theme==='sand'){ p.c='#E4C87E'; p.x=Utils.rnd(0,W); p.y=Utils.rnd(0,H); p.vx=Utils.rnd(-120,-40); p.vy=Utils.rnd(-8,8); p.s=2; p.life=0.6; }
      else if(theme==='snow'){ p.c='#FFFFFF'; p.x=Utils.rnd(0,W); p.y=Utils.rnd(-20,H); p.vx=Utils.rnd(-8,8); p.vy=Utils.rnd(40,80); p.s=2; }
      else if(theme==='ember'){ p.c=Utils.pick(['#FF8A50','#FFC107','#FF5722']); p.x=Utils.rnd(0,W); p.y=Utils.rnd(H/2,H+20); p.vx=Utils.rnd(-12,12); p.vy=Utils.rnd(-70,-30); p.s=2; }
      else if(theme==='fog'){ p.c='rgba(200,220,180,0.5)'; p.x=Utils.rnd(0,W); p.y=Utils.rnd(0,H); p.vx=Utils.rnd(10,30); p.vy=0; p.s=Utils.rnd(8,22); p.life=1; }
      else if(theme==='void'){ p.c=Utils.pick(['#B948C2','#7B3899','#E040FB']); p.x=Utils.rnd(0,W); p.y=Utils.rnd(-20,H); p.vx=Utils.rnd(-6,6); p.vy=Utils.rnd(12,30); p.s=2; }
      this.weather.push(p);
    }
  }
  updateWeather(dt){
    for(let i=this.weather.length-1;i>=0;i--){ const p=this.weather[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
      const W=this.r.W,H=this.r.H;
      if(p.theme==='ember'){ if(p.y<0){ p.y=H; p.x=Utils.rnd(0,W);} }
      else if(p.y>H+24 || p.y<-30 || p.x<-30 || p.x>W+30) this.weather.splice(i,1);
      else if(p.life<=0) this.weather.splice(i,1);
    }
    const cap=this.q==='HIGH'?70:(this.q==='MEDIUM'?36:16);
    if(this.weather.length<cap){ const theme=this._weatherTheme; if(theme) this.weatherSpawn(theme); }
  }
  setWeather(theme){ this._weatherTheme=theme; this.weather=[]; for(let i=0;i<20;i++) this.weatherSpawn(theme); }
  update(dt){ for(let i=this.list.length-1;i>=0;i--){ const p=this.list[i]; p.life-=dt;
    if(p.type==='dmg'){ p.y+=p.vy*dt; p.vy*=0.92; }
    else if(p.type==='bolt'){ /* 静态 */ }
    else if(p.type!=='ring'){ p.x+=p.vx*dt; p.y+=p.vy*dt; }
    if(p.life<=0){ this.pool.push(p); this.list.splice(i,1); } } }
  render(){ const c=this.r.ctx;
    for(const p of this.list){
      const a=Utils.clamp(p.life/p.max,0,1);
      if(p.type==='ring'){ c.strokeStyle=Utils.pick([p.c]); c.globalAlpha=a; c.lineWidth=3; c.beginPath(); c.arc(p.x,p.y,p.rad+(1-a)*26,0,7); c.stroke(); c.globalAlpha=1; }
      else if(p.type==='dmg'){ c.globalAlpha=a; c.fillStyle=p.c; c.font=p.s+'px "Courier New",monospace'; c.textAlign='center'; c.fillText(p.txt,p.x,p.y); c.globalAlpha=1; c.textAlign='left'; }
      else if(p.type==='bolt'){ c.globalAlpha=a; c.strokeStyle=p.c; c.lineWidth=3; c.beginPath(); c.moveTo(p.x1,p.y1);
        const mx=(p.x1+p.x2)/2+Utils.rnd(-20,20), my=(p.y1+p.y2)/2+Utils.rnd(-20,20);
        c.lineTo(mx,my); c.lineTo(p.x2,p.y2); c.stroke(); c.globalAlpha=1; }
      else { c.fillStyle=p.c; c.globalAlpha=a; c.fillRect(Math.floor(p.x),Math.floor(p.y),p.s,p.s); c.globalAlpha=1; } } }
  renderWeather(){ const c=this.r.ctx; for(const p of this.weather){
    if(p.theme==='fog'){ c.fillStyle=p.c; c.globalAlpha=0.18; c.fillRect(p.x,p.y,p.s,p.s*0.5); c.globalAlpha=1; }
    else { c.globalAlpha=Utils.clamp(p.life,0.3,1); c.fillStyle=p.c; c.fillRect(Math.floor(p.x),Math.floor(p.y),p.s,p.s); c.globalAlpha=1; } } }
}
"use strict";
// ============================================================
// 实体（玩家 / 怪物 / 投射物 / 拾取物 / 场景物件）
// ============================================================
class Player {
  constructor(heroId, weaponKey){
    const H=HEROES[heroId]; const W=WEAPONS[weaponKey]||WEAPONS.crossbow;
    this.heroId=heroId; this.w=H.w; this.h=H.h; this.colW=H.colW; this.colH=H.colH;
    this.x=CONFIG.WORLD_W/2; this.y=CONFIG.WORLD_H/2;
    this.speed=H.speed; this.maxHp=H.hp; this.hp=H.hp;
    this.weaponKey=weaponKey;
    this.rate=1/(W.rate||H.fireRate);
    this.projSpeed=(W.speed||H.projSpeed);
    this.pickup=H.pickup; this.crit=0.05; this.multishot=0; this.pierce=0; this.healOnKill=0;
    this.thorn=0; this.explode=0; this.vampire=0; this.shield=0; this.expMult=1;
    this.level=1; this.exp=0; this.state='idle'; this.frame=0; this.frameT=0; this.dir=1;
    this.invincible=0; this.attackT=0; this.moving=false; this.alive=true; this.attackAnimT=0;
  }
  getBox(){ return {x:this.x+ (this.w-this.colW)/2, y:this.y+ (this.h-this.colH)/2, w:this.colW, h:this.colH}; }
  expNeed(){ return Math.floor(80+ (this.level-1)*32); }
  addExp(n){ this.exp+=n; }
  update(dt, input){
    if(!this.alive) return;
    let dx=0,dy=0;
    if(input.left) dx-=1; if(input.right) dx+=1; if(input.up) dy-=1; if(input.down) dy+=1;
    this.moving = (dx||dy)!==0;
    if(this.moving){ const l=Math.sqrt(dx*dx+dy*dy); dx/=l; dy/=l;
      this.x=Utils.clamp(this.x+dx*this.speed*dt, 12, CONFIG.WORLD_W-12);
      this.y=Utils.clamp(this.y+dy*this.speed*dt, 12, CONFIG.WORLD_H-12);
      if(dx) this.dir = dx>0?1:-1; this.state='walk'; }
    else this.state='idle';
    if(this.invincible>0) this.invincible-=dt;
    this.attackT-=dt;
    if(this.attackAnimT>0) this.attackAnimT-=dt;
    const fps=CONFIG.ANIM[this.state==='walk'?'walk':'idle'];
    this.frameT+=dt; if(this.frameT>=1/fps){ this.frameT=0; this.frame=(this.frame+1)%2; }
  }
  hurt(dmg, game){
    if(this.invincible>0 || !this.alive) return;
    if(game.up.shield && game.shieldActive){ game.shieldActive=false; game.shieldTimer=45; game.particles.ring(this.x+this.w/2,this.y+this.h/2,'#80D8FF'); game.toast('屏障抵挡'); return; }
    this.hp-=dmg; this.invincible=CONFIG.INVINCIBLE; game.audio.sfx('hurt'); game.r.flash=1; game.r.shake=Math.max(game.r.shake,3);
    if(game.up.thorn){ for(const m of game.monsters){ if(Utils.dist(m.x+m.w/2,m.y+m.h/2,this.x+this.w/2,this.y+this.h/2)<46){ m.hp-=10*(game.up.thorn); if(m.hp<=0) game.killMonster(m); } } }
    if(this.hp<=0){ this.hp=0; this.alive=false; game.onPlayerDeath(); }
  }
}

// 怪物（支持区域着色 / 减速 / 灼烧 / 视野索敌）
class Monster {
  constructor(type,x,y,scale,regionTint){
    const T=MONSTERS[type]; this.type=type; this.x=x; this.y=y;
    this.w=T.w*scale; this.h=T.h*scale; this.speed=T.speed*(0.9+Utils.rnd(0,0.2));
    this.hp=T.hp*scale; this.maxHp=this.hp; this.dmg=T.dmg; this.scale=scale;
    // 视野范围：玩家进入视野才追击；视野外缓慢游荡，不全局追人
    this.vision=this.visionOf(type);
    this.attackT=0; this.isBoss=(type==='boss'); this.bossId=0; this.enraged=false; this.frameT=0; this.frame=0;
    this.alpha=(type==='fast')?0.85:1; this.tint=regionTint||null;
    this.slow=0; this.burn=0; this.burnT=0; this.hitFlash=0;
    // 游荡：视野外随机漂移
    this.wanderT=Utils.rnd(0.5,2); this.wvx=0; this.wvy=0; this.slowMove=Utils.rnd(14,26);
  }
  visionOf(type){ return { basic:760, fast:800, heavy:700, archer:780, mutated:760, boss:940 }[type]||760; }
  getBox(){ return {x:this.x+ this.w*0.15, y:this.y+ this.h*0.15, w:this.w*0.7, h:this.h*0.7}; }
  applyStatus(dt){
    if(this.slow>0){ this.slow-=dt; }
    if(this.burn>0){ this.burnT-=dt; if(this.burnT<=0){ this.burnT=0.5; this.hp-=this.burn; } }
    if(this.hitFlash>0) this.hitFlash-=dt;
  }
  update(dt, p, game){
    if(this.isBoss){ this.updateBoss(dt,p,game); return; }
    this.applyStatus(dt);
    const b=this.getBox(), pb=p.getBox();
    const cx=this.x+this.w/2, cy=this.y+this.h/2, pcx=p.x+p.w/2, pcy=p.y+p.h/2;
    const d=Utils.dist(cx,cy,pcx,pcy)||1;
    // 视野索敌：玩家进入视野才追击；视野外原地/缓慢游荡
    let sp=this.speed*(this.slow>0?0.45:1); if(game.hiding && d<140) sp*=0.4;
    if(d<this.vision){
      this.x+=(pcx-cx)/d*sp*dt; this.y+=(pcy-cy)/d*sp*dt;
    } else {
      this.wanderT-=dt;
      if(this.wanderT<=0){ this.wanderT=Utils.rnd(1.2,3); const a=Utils.rnd(0,Math.PI*2); this.wvx=Math.cos(a)*this.slowMove; this.wvy=Math.sin(a)*this.slowMove; }
      this.x=Utils.clamp(this.x+this.wvx*dt,0,CONFIG.WORLD_W); this.y=Utils.clamp(this.y+this.wvy*dt,0,CONFIG.WORLD_H);
    }
    if(Utils.rr(b,pb)){ p.hurt(this.dmg,game); }
    if(this.type==='archer'){ this.attackT-=dt;
      if(this.attackT<=0 && d<420){ this.attackT=2.2; game.shootMonster(this.x+this.w/2,this.y+this.h/2,pcx,pcy,this.dmg*0.6); } }
    this.frameT+=dt; if(this.frameT>=0.3){ this.frameT=0; this.frame=this.frame?0:1; }
  }
  updateBoss(dt,p,game){
    this.applyStatus(dt);
    const cx=this.x+this.w/2, cy=this.y+this.h/2, pcx=p.x+p.w/2, pcy=p.y+p.h/2;
    if(!this.enraged && this.hp<this.maxHp*0.35){ this.enraged=true; game.toast('BOSS 狂暴！'); game.r.shake=8; game.audio.sfx('boss'); }
    const sp=(this.enraged?48:28)*(this.slow>0?0.5:1);
    const d=Utils.dist(cx,cy,pcx,pcy)||1;
    // BOSS 恒追击玩家（无视视野）；被甩开太远时直接拉回玩家附近，避免永远追不上
    if(d>1500){ this.x=pcx+Utils.rnd(-520,520); this.y=pcy+Utils.rnd(-420,420); game.particles.ring(this.x+this.w/2,this.y+this.h/2,'#FF5252'); }
    else if(d>150){ this.x+=(pcx-cx)/d*sp*dt; this.y+=(pcy-cy)/d*sp*dt; }
    this.attackT-=dt;
    if(this.attackT<=0){
      this.attackT = this.enraged?1.9:3.0;
      const mode=Math.floor(Math.random()*3);
      if(mode===0){ // 砸地 AoE
        game.r.shake=12; game.particles.ring(cx,cy,'#FF5252');
        const r= this.enraged?190:140;
        if(Utils.dist(p.x+p.w/2,p.y+p.h/2,cx,cy)<r) p.hurt((this.enraged?28:20),game);
      } else if(mode===1){ // 弹幕
        const n= this.enraged?12:8;
        for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; game.shootMonster(cx,cy,cx+Math.cos(a)*300,cy+Math.sin(a)*300,12); }
      } else { // 冲锋
        game.r.shake=8; const spd=this.enraged?420:320; const a=Math.atan2(pcy-cy,pcx-cx);
        game.projs.push(new Projectile(cx,cy,Math.cos(a)*spd,Math.sin(a)*spd,this.enraged?26:18,{enemy:true,s:9,color:'#FF5252',life:1.0}));
      }
    }
    if(Utils.rr(this.getBox(),p.getBox())) p.hurt(25,game);
    this.frameT+=dt; if(this.frameT>=0.4){ this.frameT=0; this.frame=(this.frame+1)%3; }
  }
}

// 投射物（带武器类型）
class Projectile {
  constructor(x,y,dx,dy,dmg,opt){ this.x=x; this.y=y; this.vx=dx; this.vy=dy; this.dmg=dmg;
    this.pierce=opt.pierce||0; this.isEnemy=opt.enemy||false; this.s=opt.s||6; this.life=opt.life||1.4; this.ring=opt.ring||false;
    this.wtype=opt.wtype||(opt.enemy?'enemy':'pierce'); this.color=opt.color||(opt.enemy?'#B948C2':'#FFD740');
    this.trail=[]; this.slowT=opt.slowT||0; this.burnT=opt.burnT||0; this.chain=opt.chain||0; }
  update(dt){ this.x+=this.vx*dt; this.y+=this.vy*dt; this.life-=dt;
    this.trail.unshift({x:this.x,y:this.y}); if(this.trail.length>5) this.trail.pop(); }
}

// 拾取物
class Pickup {
  constructor(type,x,y,val){ this.type=type; this.x=x; this.y=y; this.val=val; this.t=0;
    this.vx=Utils.rnd(-30,30); this.vy=Utils.rnd(-30,30); }
}

"use strict";
// ============================================================
// 剧情动画播放器 V4：快速吸睛 + 每幕点击推进
// ============================================================
class StoryPlayer {
  constructor(r,audio,onDone,showSkip){ this.r=r; this.audio=audio; this.onDone=onDone; this.showSkip=!!showSkip;
    this.skipBtn=document.getElementById('skip-btn'); this.subEl=document.getElementById('subtitle-layer'); this.nextBtn=document.getElementById('story-next-btn');
    this.idx=0; this.t=0; this.sceneT=0; this.playing=false; this.done=false;
    this.subText=''; this.subShow=''; this.subT=0; this.voiceKey='';
    this.white=0; this.cam={x:0,y:0,scale:1,alpha:1};
    this.scenes=this.buildScenes();
    this.skipBtn.onclick=()=>this.finish(true);
    this.nextBtn.onclick=()=>this.next();
  }
  buildScenes(){
    return [
      {sub:'虚空裂隙，撕裂了天空', voice:'s1', minDur:2.2, maxDur:6, draw:t=>this.sceneRift(t)},
      {sub:'次元彼端，是一片被遗忘的土地', voice:'s2', minDur:2.4, maxDur:6, draw:t=>this.sceneRiftClose(t)},
      {sub:'人们叫它 —— 像素秘境', voice:'s3', minDur:2.2, maxDur:5, draw:t=>this.s1(t)},
      {sub:'这里曾是冒险者的乐土，人人都能找到属于自己的冒险', voice:'s4', minDur:3.2, maxDur:7, draw:t=>this.s1b(t)},
      {sub:'没有人知道，虚空的侵蚀早已悄然开始', voice:'s5', minDur:2.6, maxDur:6, draw:t=>this.s1c(t)},
      {sub:'直到那一天，裂隙彻底张开，魔物倾泻而出', voice:'s6', minDur:2.6, maxDur:6, draw:t=>this.sceneSwarm(t)},
      {sub:'战斗爆发了，可魔物永无止境', voice:'s7', minDur:2.6, maxDur:6, draw:t=>this.s2c(t)},
      {sub:'倒下的冒险者化作灵魂碎片，带着秘境能量归来', voice:'s8', minDur:3.0, maxDur:7, draw:t=>this.s3(t)},
      {sub:'每一次倒下都不是终点，秘境币将成为你冒险的力量', voice:'s9', minDur:3.0, maxDur:7, draw:t=>this.s3b(t)},
      {sub:'探索六大区域，净化被侵蚀的秘境 —— 现在，轮到你出发了！', voice:'s10', minDur:3.4, maxDur:8, draw:t=>this.s4(t)},
      {sub:'', voice:null, minDur:0.6, maxDur:0.6, draw:t=>this.logo(t)}
    ];
  }
  start(){ this.playing=true; this.idx=0; this.t=0; this.sceneT=0;
    // 首次观看不显示跳过；后续重看才显示
    this.skipBtn.style.display=this.showSkip?'block':'none';
    this.subEl.style.display='block'; this.nextBtn.style.display='block';
    this.audio.bgm('story'); this.enterScene(); this.loop(); }
  enterScene(){ const sc=this.scenes[this.idx]; this.sceneT=0; this.subText=''; this.subShow=''; this.subT=0;
    if(sc.voice && sc.voice!==this.voiceKey){ this.voiceKey=sc.voice; this.audio.voice(sc.voice); }
    if(!sc.sub){ this.subEl.textContent=''; } }
  loop(){ if(!this.playing) return; const now=performance.now(); this.t+=0.016; this.sceneT+=0.016;
    const sc=this.scenes[this.idx];
    if(this.sceneT>=sc.maxDur){ this.next(); }
    else { this.update(sc); this.render(sc); }
    requestAnimationFrame(()=>this.loop()); }
  next(){ if(!this.playing||this.done) return;
    const sc=this.scenes[this.idx];
    if(this.sceneT<sc.minDur) return; // 未达最短停留，忽略点击
    this.white=0.6;
    if(this.idx>=this.scenes.length-1){ this.finish(false); return; }
    this.idx++; this.enterScene(); }
  update(sc){
    const k=0.05; this.cam.scale+=(sc.camScale||1 - this.cam.scale)*k;
    if(this.white>0) this.white=Math.max(0,this.white-0.05);
    if(sc.sub!==this.subText){ this.subText=sc.sub; this.subShow=''; this.subT=0; if(!sc.sub) this.subEl.textContent=''; }
    if(this.subShow.length<this.subText.length){ this.subT+=16;
      if(this.subT>=CONFIG.SUBTITLE_MS){ this.subT=0; this.subShow=this.subText.slice(0,this.subShow.length+1); this.subEl.textContent=this.subShow; } }
  }
  render(sc){ const r=this.r; r.clear(); r.cam.x=0; r.cam.y=0; r.cam.alpha=1;
    r.camPush(); sc.draw(this.sceneT); r.camPop();
    if(this.white>0){ r.ctx.globalAlpha=this.white; r.ctx.fillStyle='#fff'; r.ctx.fillRect(0,0,r.W,r.H); r.ctx.globalAlpha=1; }
    const last=this.idx>=this.scenes.length-1;
    this.nextBtn.textContent = last? '点击开始冒险 ▶' : '点击进入下一幕 ▶';
    if(last){ this.subEl.style.display='none'; } }
  finish(skipped){ if(this.done) return; this.done=true; this.playing=false; this.skipBtn.style.display='none'; this.subEl.style.display='none'; this.nextBtn.style.display='none';
    this.audio.stopVoice(); this.audio.stopBgm();
    Utils.storage.set(CONFIG.STORAGE.WATCHED,true);
    if(this.onDone) this.onDone(); }

  // ---------- 场景绘制（每幕画面丰富化：风景/人物/环境对象） ----------
  stars(n,seed){ const r=this.r.ctx; for(let i=0;i<n;i++){ const x=(i*97+seed*13)%CONFIG.W, y=(i*61+seed*7)%CONFIG.H;
    r.fillStyle=`rgba(${150+ (i%100)},${80+(i%60)},${200+(i%55)},${0.4+Math.random()*0.5})`; r.fillRect(x,y,2,2); } }
  mountains(){ const c=this.r.ctx; c.fillStyle='#2E3A45'; for(let i=0;i<9;i++){ const bx=i*170, by=CONFIG.H/2+10;
    c.beginPath(); c.moveTo(bx,by+60); c.lineTo(bx+85,by-70); c.lineTo(bx+170,by+60); c.closePath(); c.fill(); }
    c.fillStyle='#E8F6FF'; c.fillRect(150,100,34,34); c.fillRect(420,60,26,26); c.fillRect(880,90,30,30); }
  clouds(count,off){ const c=this.r.ctx; for(let i=0;i<count;i++){ const x=((i*317+off*23+this.t*8)%(CONFIG.W+160))-80, y=(i*89+off*37)%(CONFIG.H/2-70);
    c.fillStyle='rgba(255,255,255,0.85)'; c.fillRect(x,y,80,22); c.fillRect(x+20,y-12,52,16); c.fillRect(x+46,y+10,40,12); } }

    for(let i=0;i<5;i++){ const bx=((i*260+this.t*30)%CONFIG.W), by=(60+i*30)%(CONFIG.H/2-30); c.beginPath(); c.arc(bx,by,5,0,7); c.arc(bx+10,by-4,5,0,7); c.stroke(); } }
  flowers(fx,fy){ const c=this.r.ctx; const cols=['#E91E63','#FFEB3B','#FF7043','#CE93D8','#FF5252'];
    for(let i=0;i<fx.length;i++){ c.fillStyle=cols[i%cols.length]; c.fillRect(fx[i],fy[i],4,4); c.fillStyle='#2E7D32'; c.fillRect(fx[i]+1,fy[i]+3,2,6); } }

  // 幕1：虚空裂隙撕裂天空（冲击波 + 速度线 + 崩碎浮岩 + 废墟剪影）

"use strict";
// ============================================================
// 输入系统（PC 键盘 + 移动端摇杆，支持旋转映射）
// ============================================================
class InputManager {
  constructor(screen){ this.screen=screen; this.keys={up:false,down:false,left:false,right:false};
    this.joystick={active:false,dx:0,dy:0};
    window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
      if(k==='w'||k==='arrowup')this.keys.up=true; if(k==='s'||k==='arrowdown')this.keys.down=true;
      if(k==='a'||k==='arrowleft')this.keys.left=true; if(k==='d'||k==='arrowright')this.keys.right=true;
      if(k==='escape') Game.instance.togglePause(); });
    window.addEventListener('keyup',e=>{ const k=e.key.toLowerCase();
      if(k==='w'||k==='arrowup')this.keys.up=false; if(k==='s'||k==='arrowdown')this.keys.down=false;
      if(k==='a'||k==='arrowleft')this.keys.left=false; if(k==='d'||k==='arrowright')this.keys.right=false; });
    window.addEventListener('blur',()=>{ this.keys.up=this.keys.down=this.keys.left=this.keys.right=false; if(Game.instance&&Game.instance.state==='playing') Game.instance.pause(); });
    if(Utils.isMobile()) this.initJoystick();
  }
  initJoystick(){ const el=document.getElementById('joystick'), thumb=document.getElementById('joystick-thumb'); el.style.display='block';
    let cx=0,cy=0; const R=40;
    el.addEventListener('touchstart',e=>{ e.preventDefault(); const rc=el.getBoundingClientRect(); cx=rc.left+rc.width/2; cy=rc.top+rc.height/2; this.joystick.active=true; },{passive:false});
    el.addEventListener('touchmove',e=>{ e.preventDefault(); if(!this.joystick.active)return; const t=e.touches[0]; const pos=this.screen.map(t.clientX,t.clientY);
      let dx=pos.x-cx, dy=pos.y-cy; const d=Math.sqrt(dx*dx+dy*dy); if(d>R){ dx=dx/d*R; dy=dy/d*R; }
      thumb.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      this.joystick.dx=dx/R; this.joystick.dy=dy/R; },{passive:false});
    const end=e=>{ e.preventDefault(); this.joystick.active=false; this.joystick.dx=0; this.joystick.dy=0; thumb.style.transform='translate(-50%,-50%)'; };
    el.addEventListener('touchend',end,{passive:false}); el.addEventListener('touchcancel',end,{passive:false}); }
  get(){ if(Utils.isMobile()&&this.joystick.active) return { left:this.joystick.dx<-0.2, right:this.joystick.dx>0.2, up:this.joystick.dy<-0.2, down:this.joystick.dy>0.2 };
    return this.keys; }
}

// 主游戏
// ============================================================
class Game {
  constructor(){
    Game.instance=this;
    this.canvas=document.getElementById('game-canvas');
    this.r=new Renderer(this.canvas);
    this.screen=new ScreenManager();
    this.sprites=new SpriteFactory(this.r);
    this.audio=new AudioManager();
    this.input=new InputManager(this.screen);
    this.quality=Utils.storage.get(CONFIG.STORAGE.QUALITY,'HIGH');
    this.particles=new ParticleSystem(this.r,this.quality);
    this.bank=Utils.storage.get(CONFIG.STORAGE.COINS,0);
    this.unlocks=Utils.storage.get(CONFIG.STORAGE.UNLOCKS,['wanderer']);
    this.purchases=Utils.storage.get(CONFIG.STORAGE.PURCHASES,{});
    this.selected=Utils.storage.get(CONFIG.STORAGE.HERO,'wanderer');
    this.weapons=Utils.storage.get(CONFIG.STORAGE.WEAPONS,['crossbow']);
    this.weapon=Utils.storage.get(CONFIG.STORAGE.WEAPON,'crossbow');
    this.region=Utils.storage.get(CONFIG.STORAGE.REGION,'forest');
    this.regionProgress=Utils.storage.get(CONFIG.STORAGE.REGION_PROGRESS,0);
    this.cleared=Utils.storage.get(CONFIG.STORAGE.CLEARED,[]);
    this.state='menu'; this.mode='menu';
    this.time=0; this.lastT=0; this.accum=0; this.fps=Utils.isMobile()?CONFIG.FPS_MOBILE:CONFIG.FPS_PC; this.fixedDt=1/this.fps;
    this.bossSpawned=false; this.spawnT=0; this.tooltipTimer=null; this.regionClearedInRun=false;
    this.up={}; this.runCoins=0; this.kills=0;
    this.bindUI(); this.refreshMenu(); this.refreshShop(); this.refreshHeroes(); this.refreshWeapons(); this.refreshRegions(); this.refreshSettings(); this.refreshPrep();
  }
  // ---------- UI 绑定 ----------
  $(id){ return document.getElementById(id); }
  bindUI(){
    this.$('btn-prep').onclick=()=>{ this.audio.sfx('click'); this.show('screen-prep'); this.refreshPrep(); };
    this.$('btn-prep-back').onclick=()=>{ this.audio.sfx('click'); this.show('screen-menu'); };
    this.$('btn-prep-go').onclick=()=>{ this.audio.sfx('click'); this.startRun(this.selected,this.weapon,this.region); };
    this.$('btn-heroes').onclick=()=>{ this.audio.sfx('click'); this.show('screen-heroes'); };
    this.$('btn-heroes-back').onclick=()=>{ this.audio.sfx('click'); this.show('screen-menu'); };
    this.$('btn-weapons').onclick=()=>{ this.audio.sfx('click'); this.show('screen-weapons'); this.refreshWeapons(); };
    this.$('btn-weapons-back').onclick=()=>{ this.audio.sfx('click'); this.show('screen-menu'); };
    this.$('btn-regions').onclick=()=>{ this.audio.sfx('click'); this.show('screen-regions'); this.refreshRegions(); };
    this.$('btn-regions-back').onclick=()=>{ this.audio.sfx('click'); this.show('screen-menu'); };
    this.$('btn-fullmap-close').onclick=()=>{ this.audio.sfx('click'); this.hideAll(); if(this.mode==='run'){ this.$('hud').style.display='block'; this.state='playing'; } else this.show('screen-menu'); };
    this.$('btn-shop').onclick=()=>{ this.audio.sfx('click'); this.show('screen-shop'); this.refreshShop(); };
    this.$('btn-shop-back').onclick=()=>{ this.audio.sfx('click'); this.show('screen-menu'); };
    this.$('btn-story').onclick=()=>{ this.audio.sfx('click'); this.playStory(); };
    this.$('btn-resume').onclick=()=>{ this.audio.sfx('click'); this.resume(); };
    this.$('btn-quit').onclick=()=>{ this.audio.sfx('click'); this.backToMenu(); };
    this.$('btn-settle-ok').onclick=()=>{ this.audio.sfx('click'); this.settleConfirm(); };
    this.$('btn-settle-menu').onclick=()=>{ this.audio.sfx('click'); this.settleConfirm(true); };
    this.$('pause-btn').onclick=()=>this.togglePause();
    this.$('seg-quality').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; this.setQuality(b.dataset.q); });
    this.$('seg-sound').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; this.audio.setSound(b.dataset.s==='1'); this.refreshSettings(); });
    this.$('seg-voice').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; this.audio.setVoice(b.dataset.v==='1'); this.refreshSettings(); });
    this.$('seg-climate').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; this.audio.setClimate(b.dataset.c==='1'); this.refreshSettings(); });
    // 小地图：双击查看完整地图
    const mm=this.$('minimap'); mm.addEventListener('dblclick',e=>{ e.stopPropagation(); this.openFullMap(); });
    mm.addEventListener('click',e=>{ e.stopPropagation(); this.openFullMap(); });
    this.$('btn-map').onclick=(e)=>{ e.stopPropagation(); this.openFullMap(); };
    // 画布点击：查看/交互物品
    this.canvas.addEventListener('click',e=>this.onCanvasClick(e));
    this.canvas.addEventListener('touchstart',e=>{ if(!Utils.isMobile()) return; const t=e.touches[0]; this.onCanvasTap(t); },{passive:true});
    // 完整地图点击
    this.$('fullmap-canvas').addEventListener('click',e=>this.onFullMapClick(e));
  }
  show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show')); this.$(id).classList.add('show'); }
  hideAll(){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show')); }
  // ---------- 菜单/商店/英雄/武器/区域 ----------
  refreshMenu(){ this.$('menu-coins').textContent=this.bank; this.$('menu-regions').textContent=this.cleared.length; }
  refreshSettings(){
    document.querySelectorAll('#seg-quality button').forEach(b=>b.classList.toggle('on', b.dataset.q===this.quality));
    document.querySelectorAll('#seg-sound button').forEach(b=>b.classList.toggle('on', b.dataset.s===(this.audio.sound?'1':'0')));
    document.querySelectorAll('#seg-voice button').forEach(b=>b.classList.toggle('on', b.dataset.v===(this.audio.voiceOn?'1':'0')));
    document.querySelectorAll('#seg-climate button').forEach(b=>b.classList.toggle('on', b.dataset.c===(this.audio.climateOn?'1':'0')));
  }

  renderFullMap(){
    const c=this.$('fullmap-canvas').getContext('2d'); c.imageSmoothingEnabled=false;
    const W=920,H=560; c.fillStyle='#0a0e18'; c.fillRect(0,0,W,H);
    // 网格底纹
    c.strokeStyle='rgba(255,255,255,0.05)'; c.lineWidth=1;
    for(let x=0;x<W;x+=40){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
    for(let y=0;y<H;y+=40){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
    const pos={ forest:[120,430], desert:[300,330], tundra:[470,180], volcano:[650,260], swamp:[800,430], void:[700,90] };
    // 连接路径
    c.strokeStyle='rgba(255,255,255,0.18)'; c.lineWidth=3; c.setLineDash([8,8]);
    c.beginPath();
    REGION_ORDER.forEach((k,i)=>{ const [x,y]=pos[k]; if(i===0) c.moveTo(x,y); else c.lineTo(x,y); }); c.stroke(); c.setLineDash([]);
    // 区域节点
    REGION_ORDER.forEach(k=>{ const rg=REGIONS[k]; const [x,y]=pos[k]; const unlocked=this.regionUnlocked(k); const done=this.cleared.includes(k);
      c.save(); c.globalAlpha=unlocked?1:0.45;
      c.fillStyle=rg.color; c.fillRect(x-60,y-35,120,70);
      c.fillStyle='rgba(0,0,0,0.35)'; c.fillRect(x-60,y-35,120,70);
      c.strokeStyle=unlocked?rg.color:'#444'; c.lineWidth=3; c.strokeRect(x-60,y-35,120,70);
      if(this.region===k && this.mode==='run'){ c.strokeStyle='#FFD740'; c.globalAlpha=0.5+0.5*Math.sin(performance.now()/200); c.lineWidth=5; c.strokeRect(x-66,y-41,132,82); }
      c.fillStyle='#fff'; c.font='16px "Courier New",monospace'; c.textAlign='center';
      c.fillText(rg.name, x, y-10);
      c.fillStyle='#ffd54f'; c.font='12px "Courier New",monospace';
      c.fillText(`${rg.temp>0?'+':''}${rg.temp}°C · 湿度${rg.humid}%`, x, y+10);
      c.font='12px "Courier New",monospace'; c.fillStyle=done?'#4caf50':(unlocked?'#bbb':'#666');
      c.fillText(done?'✔ 已净化':(unlocked?`BOSS：${rg.bossName}`:'🔒 未解锁'), x, y+26);
      c.restore(); });
    // 图例
    c.fillStyle='#889'; c.font='12px "Courier New",monospace'; c.textAlign='left';

  startRun(heroId,weaponKey,regionKey){
    this.mode='run'; this.state='playing'; this.region=regionKey; this.regionClearedInRun=false; this.bossSpawned=false;
    this.hideAll(); this.$('hud').style.display='block'; if(Utils.isMobile()) this.$('pause-btn').style.display='block';
    this.audio.bgm('game'); this.audio.playClimate(regionKey);
    this.player=new Player(heroId,weaponKey);
    const pu=this.purchases; this.player.maxHp+= (pu.maxhp||0)*10; this.player.hp=this.player.maxHp;
    this.player.speed*= (1+(pu.spd||0)*0.03);
    this.player.pickup*= (1+(pu.pick||0)*0.05);
    this.monsters=[]; this.projs=[]; this.pickups=[]; this.objects=[]; this.particles=new ParticleSystem(this.r,this.quality);
    const rg=REGIONS[regionKey]; this.particles.setWeather(rg.weather);
    this.time=0; this.spawnT=0; this.up={}; this.runCoins=0; this.kills=0; this.hiding=false; this.shieldTimer=45; this.shieldActive=false;
    this.buildArena();
    for(let i=0;i<3;i++) this.spawnMonster(true);
    if(/[?&]boss=1/.test(location.search)){ this.time=CONFIG.BOSS_TIME; this.player.extraDmg=9000; }
    if(/[?&]lvlup=1/.test(location.search)){ this.player.exp=this.player.expNeed(); this.checkLevelUp(); }
    this.updateHUD(); this.renderMinimap();
    this.lastT=performance.now(); this.accum=0; this.loop();
  }
  buildArena(){
    const cw=CONFIG.W, ch=CONFIG.H, g=CONFIG.WORLD_GRID;
    // 9 屏世界：按 3×3 网格分布物件，让探索充满发现
    const kinds=['crate','crate','pot','rock','grass','grass','crystal','pot','rock','crate','grass','crystal'];
    for(let cy=0;cy<g;cy++)for(let cx=0;cx<g;cx++){
      const ox=cx*cw, oy=cy*ch;
      const n=4+Math.floor(Math.random()*3); // 每屏 4~6 个
      const placed=[];
      for(let i=0;i<n;i++){
        let x=ox+Utils.rnd(90,cw-90), y=oy+Utils.rnd(90,ch-90);
        // 避免与已放置物件重叠
        let tries=0; while(tries<6 && placed.some(p=>Math.abs(p[0]-x)<80&&Math.abs(p[1]-y)<80)){ x=ox+Utils.rnd(90,cw-90); y=oy+Utils.rnd(90,ch-90); tries++; }
        placed.push([x,y]);
        this.objects.push(new WorldObject(Utils.pick(kinds),x,y));
      }
    }
    // 出生点（世界中心）附近布置少量近身物件与结晶，开局即有可探索内容
    const cx=CONFIG.WORLD_W/2, cy=CONFIG.WORLD_H/2;
    this.objects.push(new WorldObject('crystal',cx+120,cy+80));
    this.objects.push(new WorldObject('crate',cx-160,cy+40));
    this.objects.push(new WorldObject('pot',cx+60,cy-140));
    this.objects.push(new WorldObject('grass',cx-80,cy-60));
    this.objects.push(new WorldObject('rock',cx+240,cy+180));
  }
  breakObject(o, byClick){
    if(!o.alive) return; o.alive=false;
    const cx=o.x+(o.type==='crystal'?8:8), cy=o.y+(o.type==='crystal'?11:8);
    const meta=OBJECT_META[o.type]||{};
    this.audio.sfx('break');
    if(o.type==='crate'){ this.particles.spawn(cx,cy,CONFIG.PARTICLES.explode); if(Math.random()<0.6) this.pickups.push(new Pickup('coin',cx,cy,Utils.rndInt(1,2))); else this.pickups.push(new Pickup('exp',cx,cy,22)); }
    else if(o.type==='pot'){ this.particles.spawn(cx,cy,CONFIG.PARTICLES.explode); const r=Math.random();
      if(r<0.4) this.pickups.push(new Pickup('heal',cx,cy,15)); else if(r<0.75) this.pickups.push(new Pickup('coin',cx,cy,Utils.rndInt(2,4))); else this.pickups.push(new Pickup('exp',cx,cy,30)); }
    else if(o.type==='crystal'){ this.particles.spawn(cx,cy,{high:24,med:12,low:5,colors:['#26C6DA','#B2EBF2'],life:0.9,speed:70}); this.pickups.push(new Pickup('exp',cx,cy,80)); this.r.shake=Math.max(this.r.shake,4); }
    if(byClick){ this.showTooltip(`击碎「${meta.name}」`, meta.kind, '获得掉落！', {x:cx,y:cy}); }
  }
  loop(){ if(this.mode!=='run') return;
    const now=performance.now(); let dt=(now-this.lastT)/1000; this.lastT=now;
    dt=Math.min(dt,0.1); this.accum=Math.min(this.accum+dt,0.25); // 限制累积，避免主线程掉帧后进入更新风暴
    let steps=0;
    while(this.accum>=this.fixedDt && steps<6){ this.update(this.fixedDt); this.accum-=this.fixedDt; steps++; }
    if(this.accum>=this.fixedDt) this.accum=0; // 丢弃积压，保证输入响应不卡
    this.render(); this.renderMinimap(); requestAnimationFrame(()=>this.loop()); }
  update(dt){
    if(this.state!=='playing') return;
    const p=this.player; this.time+=dt;
    const input=this.input.get(); p.update(dt,input);
    this.hiding=false; for(const o of this.objects){ if(o.type==='grass'&&Utils.dist(p.x+p.w/2,p.y+p.h/2,o.x+8,o.y+6)<40) this.hiding=true; }
    for(const o of this.objects){ if(o.type!=='rock') continue; const pb=p.getBox(), rb=o.getBox();
      if(Utils.rr(pb,rb)){ const ox=Math.min(pb.x+pb.w-rb.x, rb.x+rb.w-pb.x), oy=Math.min(pb.y+pb.h-rb.y, rb.y+rb.h-pb.y);
        if(ox<oy) p.x += (pb.x<rb.x? -ox : ox); else p.y += (pb.y<rb.y? -oy : oy); } }
    for(const o of this.objects){ if(o.type==='rock'||o.type==='grass'||!o.alive) continue;
      if(o.cd>0) o.cd-=dt;
      if(Utils.rr(p.getBox(),o.getBox()) && o.cd<=0){ o.hp--; o.cd=0.35; if(o.hp<=0) this.breakObject(o); } }
    this.autoAttack(dt);
    for(let i=this.monsters.length-1;i>=0;i--){ const m=this.monsters[i]; m.update(dt,p,this); if(!p.alive) break; }
    this.updateProjectiles(dt);
    this.updatePickups(dt);
    if(this.up.shield){ this.shieldTimer-=dt; if(this.shieldTimer<=0 && !this.shieldActive){ this.shieldActive=true; this.particles.ring(p.x+p.w/2,p.y+p.h/2,'#80D8FF'); this.toast('屏障生成'); } }
    this.checkLevelUp();
    this.spawner(dt);
    this.checkBoss();
    this.particles.update(dt);
    this.particles.updateWeather(dt);
    if(this.r.shake>0) this.r.shake=Math.max(0,this.r.shake-dt*20);
    if(this.r.flash>0) this.r.flash=Math.max(0,this.r.flash-dt*6);
    this.updateHUD();
  }
  updateProjectiles(dt){
    const p=this.player;
    for(let i=this.projs.length-1;i>=0;i--){ const pr=this.projs[i]; pr.update(dt);
      if(pr.life<=0){ this.projs.splice(i,1); continue; }
      if(pr.isEnemy){ if(Utils.rr({x:pr.x-pr.s,y:pr.y-pr.s,w:pr.s*2,h:pr.s*2},p.getBox())){ p.hurt(pr.dmg,this); this.projs.splice(i,1); continue; } }
      else { let hit=false;
        for(let j=this.monsters.length-1;j>=0;j--){ const m=this.monsters[j];
          if(Utils.rr({x:pr.x-pr.s,y:pr.y-pr.s,w:pr.s*2,h:pr.s*2},m.getBox())){
            this.damageMonster(m,pr.dmg,pr);
            if(pr.wtype==='ice'){ m.slow=Math.max(m.slow,1.2); this.particles.spawn(pr.x,pr.y,{high:8,med:4,low:1,colors:['#6EC6FF','#E1F5FE'],life:0.5,speed:40}); this.audio.sfx('ice'); }
            if(pr.wtype==='blade'){ m.burn=5; m.burnT=0.5; this.particles.spawn(pr.x,pr.y,{high:10,med:5,low:2,colors:['#FF7043','#FFD54F'],life:0.5,speed:50}); this.audio.sfx('fire'); }
            if(pr.wtype==='chain'){ this.audio.sfx('thunder'); this.chainLightning(m,pr.chain||2); }
            if(pr.pierce>0){ pr.pierce--; hit=true; } else { this.projs.splice(i,1); hit=true; break; } } }
        if(hit) continue; }
      for(const o of this.objects){ if(!o.alive) continue;
        if(o.type==='rock'&&Utils.rr({x:pr.x,y:pr.y,w:4,h:4},o.getBox())){ this.projs.splice(i,1); break; }
        if((o.type==='crate'||o.type==='pot'||o.type==='crystal')&&Utils.rr({x:pr.x,y:pr.y,w:4,h:4},o.getBox())){ o.hp--; if(o.hp<=0) this.breakObject(o); this.projs.splice(i,1); break; } }
    }
  }
  updatePickups(dt){
    const p=this.player;
    for(let i=this.pickups.length-1;i>=0;i--){ const pk=this.pickups[i]; pk.t+=dt;
      const cx=p.x+p.w/2, cy=p.y+p.h/2; const d=Utils.dist(pk.x,pk.y,cx,cy);
      const range=p.pickup*(1+(this.up.pick||0)*0.2+(this.up.magnet?0.7:0)) + (pk.type==='exp'?400:0);
      if(d<range){ const sp=Math.max(60,d*6); if(d>0.1){ pk.x+=(cx-pk.x)/d*sp*dt; pk.y+=(cy-pk.y)/d*sp*dt; } }
      if(d<18){ this.collectPickup(pk); this.pickups.splice(i,1); continue; }
      if(pk.t>12) this.pickups.splice(i,1); }
  }
  collectPickup(pk){
    const p=this.player;
    if(pk.type==='exp'){ p.addExp(pk.val); }
    else if(pk.type==='coin'){ this.runCoins+=pk.val; this.audio.sfx('coin'); }
    else if(pk.type==='heal'){ p.hp=Math.min(p.maxHp,p.hp+pk.val); this.audio.sfx('pick'); }
  }
  autoAttack(dt){
    const p=this.player; p.attackT-=dt;
    if(p.attackT>0) return;
    const W=WEAPONS[p.weaponKey]||WEAPONS.crossbow;
    let rate=(W.rate||p.fireRate||1.2)*(1+(this.up.rate||0)*0.12);
    p.attackT=1/rate; p.attackAnimT=0.12;
    const cx=p.x+p.w/2, cy=p.y+p.h/2;
    const dmg=(W.dmg||10)*(1+(this.up.dmg||0)*0.15)+(p.extraDmg||0);
    // 重锤：范围冲击波
    if(W.type==='shock'){
      const r=130; this.particles.ring(cx,cy,'#CFD8DC'); this.r.shake=Math.max(this.r.shake,6); this.audio.sfx('shoot');
      for(const m of this.monsters){ if(Utils.dist(m.x+m.w/2,m.y+m.h/2,cx,cy)<r){ this.damageMonster(m,dmg,null); this.particles.spawn(m.x+m.w/2,m.y+m.h/2,{high:6,med:3,low:1,colors:['#B0BEC5'],life:0.4,speed:30}); } }
      return; }
    let target=null, td=1e9;
    const maxR=520; // 大世界索敌：怪进入射程（约半屏内）才攻击，掉落宝石可被磁吸回收，站桩也能升级
    for(const m of this.monsters){ const d=Utils.dist(m.x+m.w/2,m.y+m.h/2,cx,cy); if(d<td && d<maxR){ td=d; target=m; } }
    let ang = target? Math.atan2(target.y+target.h/2-cy, target.x+target.w/2-cx) : (p.dir>0?0:Math.PI);
    const multi=1+(this.up.multi||0); const spread=0.16;
    this.audio.sfx('shoot');
    for(let k=0;k<multi;k++){ const a=ang+(k-(multi-1)/2)*spread;
      const spd=(W.speed||320)*(1+(this.up.pspd||0)*0.15);
      const opt={pierce:(W.type==='pierce'?(this.up.pierce||0):0),enemy:false,s:(W.type==='blade'?7:6),wtype:W.type,color:W.color,life:(W.type==='blade'?0.9:1.4)};
      if(W.type==='chain') opt.chain=2;
      this.projs.push(new Projectile(cx,cy,Math.cos(a)*spd,Math.sin(a)*spd,dmg,opt));
      // 枪口火花
      this.particles.spawn(cx+Math.cos(a)*18,cy+Math.sin(a)*18,{high:3,med:2,low:1,colors:[W.color,'#fff'],life:0.25,speed:20}); }
  }
  chainLightning(source, jumps){
    let cur=source, dmg=source.lastChainDmg||null;
    for(let n=0;n<jumps;n++){
      let best=null, bd=170;
      for(const m of this.monsters){ if(m===cur) continue; const d=Utils.dist(m.x+m.w/2,m.y+m.h/2,cur.x+cur.w/2,cur.y+cur.h/2); if(d<bd){ bd=d; best=m; } }
      if(!best) break;
      this.particles.bolt(cur.x+cur.w/2,cur.y+cur.h/2,best.x+best.w/2,best.y+best.h/2,'#FFE082');
      const dd=(dmg==null)?source.lastDmg*0.7:dmg*0.7; this.damageMonster(best,dd,null);
      this.damageMonster(best,0,null); cur=best; dmg=dd;
    }
  }
  damageMonster(m,dmg,pr){
    const p=this.player; let d=dmg;
    const critCh=0.05+(this.up.crit||0)*0.10;
    const crit=Math.random()<critCh; if(crit){ d*=2; this.r.shake=Math.max(this.r.shake,4); }
    if(pr&&pr.wtype==='chain'){ m.lastChainDmg=d; }
    m.hp-=d; m.hitFlash=0.1;
    if(d>0) this.particles.dmg(m.x+m.w/2,m.y, Math.max(1,d), crit?'#FFD740':'#fff', crit);
    if(m.hp<=0) this.killMonster(m);
  }
  killMonster(m){
    const p=this.player;
    const idx=this.monsters.indexOf(m); if(idx>=0) this.monsters.splice(idx,1);
    this.kills++;
    const cx=m.x+m.w/2, cy=m.y+m.h/2;
    if(m.isBoss){ this.particles.spawn(cx,cy,CONFIG.PARTICLES.killBoss); this.r.shake=14; this.particles.ring(cx,cy,'#FFD740');
      this.runCoins+=60; this.audio.sfx('coin'); this.onRegionBossKilled(m); }
    else { this.particles.spawn(cx,cy,CONFIG.PARTICLES.killSmall); }
    const expVal = m.isBoss?150: Math.round((2+m.scale*(3+this.time/120))*(1+(this.up.exp||0)*0.15));
    this.pickups.push(new Pickup('exp',cx,cy,expVal));
    if(!m.isBoss && Math.random()<0.08){ const v=Utils.rndInt(1,3); this.pickups.push(new Pickup('coin',cx,cy,v)); }
    if(Math.random()<0.03){ this.pickups.push(new Pickup('heal',cx,cy,12)); }
    if(this.up.lifesteal) p.hp=Math.min(p.maxHp,p.hp+2);
    if(this.up.boom){ const r=70; this.particles.spawn(cx,cy,CONFIG.PARTICLES.explode);
      for(const m2 of this.monsters){ if(Utils.dist(m2.x+m2.w/2,m2.y+m2.h/2,cx,cy)<r) this.damageMonster(m2,p.dmg*0.5,null); } }
  }
  onRegionBossKilled(m){
    const rg=REGIONS[this.region];
    this.toast(`✨ 击败 ${rg.bossName}！区域净化 +60 秘境币`);
    this.bossWarn('✨ 区域已净化 ✨');
    if(!this.cleared.includes(this.region)){ this.cleared.push(this.region); Utils.storage.set(CONFIG.STORAGE.CLEARED,this.cleared); }
    const nextOrder=rg.order+1;
    if(nextOrder<=5 && this.regionProgress<nextOrder){ this.regionProgress=nextOrder; Utils.storage.set(CONFIG.STORAGE.REGION_PROGRESS,this.regionProgress);
      const next=REGION_ORDER[nextOrder]; this.toast(`新区域解锁：${REGIONS[next].name}！`); }
    this.regionClearedInRun=true;
  }
  spawner(dt){
    this.spawnT-=dt;
    if(this.spawnT<=0){
      // 放缓刷新节奏：间隔随时间缓慢缩短，保底 1.0s，单波至多 1~2 只，配合视野索敌保证不拥挤
      const intv=Math.max(1.0, 2.4 - this.time/130);
      this.spawnT=intv*Utils.rnd(0.8,1.3);
      const n = this.time<80 ? 1 : (Math.random()<0.22?2:1);
      for(let i=0;i<n;i++){ if(this.monsters.length>=CONFIG.MAX_MONSTERS) break; this.spawnMonster(); }
    }
  }
  spawnMonster(initial){
    const t=this.time; const rg=REGIONS[this.region];
    const scale=rg.mult*(1 + t/90*0.28);
    let pool=['basic','basic','basic'];
    if(t>50) pool.push('fast','mutated');
    if(t>110) pool.push('heavy','archer');
    if(t>220) pool.push('mutated','fast','archer');
    const type=Utils.pick(pool);
    const cam=this.r.cam, vw=CONFIG.W, vh=CONFIG.H;
    let x,y; const side=Math.floor(Math.random()*4);
    if(side===0){ x=cam.x+Utils.rnd(-50,-14); y=cam.y+Utils.rnd(0,vh); }
    else if(side===1){ x=cam.x+vw+Utils.rnd(14,50); y=cam.y+Utils.rnd(0,vh); }
    else if(side===2){ x=cam.x+Utils.rnd(0,vw); y=cam.y+Utils.rnd(-50,-14); }
    else { x=cam.x+Utils.rnd(0,vw); y=cam.y+vh+Utils.rnd(14,50); }
    x=Utils.clamp(x,-60,CONFIG.WORLD_W+60); y=Utils.clamp(y,-60,CONFIG.WORLD_H+60);
    const m=new Monster(type,x,y,scale,rg.color);
    if(initial){ const p=this.player; m.x=Utils.clamp(p.x+Utils.rnd(-240,240),60,CONFIG.WORLD_W-60); m.y=Utils.clamp(p.y+Utils.rnd(-240,240),60,CONFIG.WORLD_H-60); }
    this.monsters.push(m);
  }
  checkBoss(){
    if(this.bossSpawned) return;
    if(this.time>=CONFIG.BOSS_TIME){
      this.bossSpawned=true;
      const rg=REGIONS[this.region];
      const boss=new Monster('boss',CONFIG.W/2,-80,1,rg.color);
      boss.hp=rg.bossHp; boss.maxHp=boss.hp; boss.bossCoins=60; boss.regionName=rg.name; boss.bossName=rg.bossName;
      boss.x=this.r.cam.x+CONFIG.W/2-36; boss.y=this.r.cam.y-90;
      this.monsters.push(boss);
      this.audio.sfx('boss'); this.bossWarn(`⚠ ${rg.bossName} 降临 ⚠`); this.r.shake=8;
    }
  }
  checkLevelUp(){
    const p=this.player; if(p.level>=CONFIG.MAX_LEVEL && p.exp>=p.expNeed()){
      p.exp-=p.expNeed(); p.level++; this.transcend(); return; }
    while(p.exp>=p.expNeed() && p.level<CONFIG.MAX_LEVEL){
      p.exp-=p.expNeed(); p.level++; this.openUpgradeChoice(); return; }
  }
  transcend(){
    const p=this.player; p.dmg*=1.5; p.hp=p.maxHp; this.particles.spawn(p.x+p.w/2,p.y+p.h/2,CONFIG.PARTICLES.levelup);
    this.toast('✨ 超越进化！伤害提升 50%'); this.audio.sfx('levelup');
  }
  openUpgradeChoice(){
    this.state='choosing';
    const options=this.rollUpgrades(3);
    const grid=this.$('upgrade-grid'); grid.innerHTML='';
    options.forEach(u=>{
      const card=document.createElement('div'); card.className='upgrade-card';
      const name=document.createElement('div'); name.className='uc-name '+ (u.tier==='rare'?'uc-rare':(u.tier==='relic'?'uc-relic':'uc-normal'));
      name.textContent=u.name;
      const desc=document.createElement('div'); desc.className='uc-desc'; desc.textContent=u.desc;
      card.appendChild(name); card.appendChild(desc);
      card.onclick=()=>{ u.apply(this.player,this); this.audio.sfx('levelup'); this.state='playing'; this.hideAll(); this.$('hud').style.display='block'; this.renderMinimap(); };
      grid.appendChild(card);
    });
    this.show('screen-upgrade'); this.$('screen-upgrade').style.zIndex=25;
    this.$('screen-upgrade').querySelector('h2').textContent=`升级 · 三选一（等级 ${this.player.level}）`;
  }
  rollUpgrades(n){
    const available=UPGRADES.filter(u=>(this.up[u.id]||0)<u.max);
    if(available.length===0) return available.slice(0,n);
    const result=[]; const used=new Set();
    const tiers=Object.keys(TIER_WEIGHT); const weights=tiers.map(t=>TIER_WEIGHT[t]); const total=weights.reduce((a,b)=>a+b,0);
    while(result.length<n && result.length<available.length){
      let roll=Math.random()*total, tier=tiers[0];
      for(let i=0;i<tiers.length;i++){ roll-=weights[i]; if(roll<=0){ tier=tiers[i]; break; } }
      const cands=available.filter(u=>u.tier===tier && !used.has(u.id) && !result.includes(u));
      if(cands.length===0){ const any=available.filter(u=>!used.has(u.id) && !result.includes(u));
        if(any.length===0) break; const u=Utils.pick(any); used.add(u.id); result.push(u); }
      else { const u=Utils.pick(cands); used.add(u.id); result.push(u); }
    }
    return result;
  }
  shootMonster(x,y,tx,ty,dmg){ const d=Utils.dist(x,y,tx,ty)||1; const sp=180; this.projs.push(new Projectile(x,y,(tx-x)/d*sp,(ty-y)/d*sp,dmg,{enemy:true,s:5,color:'#B948C2'})); }
  onPlayerDeath(){

    const survived=Math.floor(this.time);
    const coins=this.runCoins + Math.max(1,Math.floor(survived/20));

  togglePause(){ if(this.mode!=='run') return; if(this.state==='playing'){ this.state='paused'; this.show('screen-pause'); } else if(this.state==='paused'){ this.resume(); } }
  pause(){ if(this.state==='playing'){ this.state='paused'; this.show('screen-pause'); } }
  resume(){ if(this.state==='paused'){ this.state='playing'; this.hideAll(); this.$('hud').style.display='block'; } }
  // ---------- 渲染 ----------
  render(){
    const r=this.r; r.clear();
    // 相机跟随玩家（钳制在世界范围内）
    this.updateCamera();
    r.cam.scale=1; r.cam.alpha=1;
    this.renderSky();                    // 天空为屏幕固定层
    r.camPush();
    this.renderTiles();
    this.renderObjects();
    this.renderPickups();
    this.renderMonsters();
    this.renderProjs();
    if(this.player) this.renderPlayer();
    this.particles.render();             // 世界空间粒子
    r.camPop();
    this.particles.renderWeather();      // 天气为屏幕空间覆盖层，始终跟随视口
    if(r.flash>0){ r.ctx.globalAlpha=Math.min(1,r.flash); r.ctx.fillStyle='#fff'; r.ctx.fillRect(0,0,r.W,r.H); r.ctx.globalAlpha=1; }
  }
  updateCamera(){
    if(!this.player) return;
    const p=this.player, W=CONFIG.W,H=CONFIG.H,WW=CONFIG.WORLD_W,WH=CONFIG.WORLD_H;
    this.r.cam.x=Utils.clamp(p.x+p.w/2-W/2, 0, WW-W);
    this.r.cam.y=Utils.clamp(p.y+p.h/2-H/2, 0, WH-H);
  }
  renderSky(){
    const rg=REGIONS[this.region]; const c=this.r.ctx;
    c.fillStyle=rg.sky; c.fillRect(0,0,CONFIG.W,CONFIG.H/2);
    c.fillStyle='rgba(0,0,0,0.28)'; c.fillRect(0,0,CONFIG.W,CONFIG.H/2);
    // 天体
    if(rg.theme==='desert'){ c.fillStyle='#FFF3C4'; c.fillRect(CONFIG.W-150,40,44,44); }
    else if(rg.theme==='tundra'){ c.fillStyle='#E3F2FD'; c.fillRect(120,50,30,30); }
    else if(rg.theme==='volcano'){ c.fillStyle='#FF8A50'; c.fillRect(CONFIG.W-190,60,60,60); }
    else if(rg.theme==='void'){ c.fillStyle='#B948C2'; c.fillRect(CONFIG.W/2-10,40,24,24); }
    else if(rg.theme==='forest'){ c.fillStyle='#FFF9C4'; c.fillRect(90,60,40,40); }
    else if(rg.theme==='swamp'){ c.fillStyle='#A8C4A0'; c.fillRect(160,50,34,34); }
  }
  renderTiles(){
    const c=this.r.ctx; const rg=REGIONS[this.region];
    const g=this.r.cache.get('tile_'+rg.theme)||this.r.cache.get('tile_forest');
    const cam=this.r.cam;
    // 只绘制可见视口内的地面瓦片（大世界性能关键）
    const x0=Math.max(0,Math.floor(cam.x/16)*16), x1=Math.min(CONFIG.WORLD_W,cam.x+CONFIG.W+16);
    const y0=Math.max(CONFIG.H/2,Math.floor((cam.y+CONFIG.H/2)/16)*16), y1=Math.min(CONFIG.WORLD_H,cam.y+CONFIG.H+16);
    for(let y=y0;y<y1;y+=16)for(let x=x0;x<x1;x+=16)c.drawImage(g,x,y);
  }
  renderObjects(){
    const c=this.r.ctx; const cam=this.r.cam;
    for(const o of this.objects){ if(!o.alive) continue;
      if(o.x+40<cam.x||o.x>cam.x+CONFIG.W+40||o.y+40<cam.y||o.y>cam.y+CONFIG.H+40) continue;
      const meta=OBJECT_META[o.type]||{}; const box=o.getBox(); o.glow+=0.08;
      const destructible=(o.type==='crate'||o.type==='pot'||o.type==='crystal');
      // 可破坏物件：脉动光晕
      if(destructible){ c.globalAlpha=0.25+0.15*Math.sin(o.glow); c.fillStyle=o.type==='crystal'?'#26C6DA':'#FFD54F';
        c.fillRect(box.x-4,box.y-4,box.w+8,box.h+8); c.globalAlpha=1; }
      let key='obj_'+o.type; if(o.type==='crate'&&o.hp<=1) key='obj_crate_broken';
      const s=this.r.cache.get(key); if(s){ c.drawImage(s,o.x,o.y);
        // 高亮描边
        c.strokeStyle='rgba(255,255,255,0.55)'; c.lineWidth=1.5; c.strokeRect(o.x+0.5,o.y+0.5,box.w-1,box.h-1); } }
  }
  renderPickups(){
    const c=this.r.ctx; const cam=this.r.cam;
    for(const pk of this.pickups){ if(pk.x+20<cam.x||pk.x>cam.x+CONFIG.W+20||pk.y+20<cam.y||pk.y>cam.y+CONFIG.H+20) continue;
      const bob=Math.sin(pk.t*5)*1; const glow=0.35+0.25*Math.sin(pk.t*6);
      c.globalAlpha=glow;
      if(pk.type==='exp'){ c.fillStyle='#FFD740'; c.beginPath(); c.arc(pk.x,pk.y,9,0,7); c.fill(); c.globalAlpha=1; c.fillStyle='#FFF8E1'; c.fillRect(pk.x-2,pk.y+bob-2,4,4); }
      else if(pk.type==='coin'){ c.fillStyle='#FFC107'; c.beginPath(); c.arc(pk.x,pk.y,10,0,7); c.fill(); c.globalAlpha=1; c.fillStyle='#FFE082'; c.fillRect(pk.x-3,pk.y+bob-3,6,6); c.fillStyle='#FFF8E1'; c.fillRect(pk.x-1,pk.y+bob-1,2,2); }
      else if(pk.type==='heal'){ c.fillStyle='#E53935'; c.beginPath(); c.arc(pk.x,pk.y,10,0,7); c.fill(); c.globalAlpha=1; c.fillStyle='#fff'; c.fillRect(pk.x-1,pk.y+bob-4,2,8); c.fillRect(pk.x-3,pk.y+bob,6,2); }
    }
  }
  renderMonsters(){
    const c=this.r.ctx; const rg=REGIONS[this.region]; const cam=this.r.cam;
    for(const m of this.monsters){ if(m.x+m.w+30<cam.x||m.x>cam.x+CONFIG.W+30||m.y+m.h+30<cam.y||m.y>cam.y+CONFIG.H+30) continue;
      const key='mon_'+m.type; let s=this.r.cache.get(key);
      if(m.isBoss) s=this.r.cache.get('mon_boss_base');
      if(!s) continue; c.save();
      if(m.alpha<1) c.globalAlpha=m.alpha;
      if(m.hitFlash>0){ c.globalAlpha*=0.6; }
      const bob = m.isBoss? Math.sin(m.frame)*2 : Math.sin(m.frameT*10)*1;
      c.drawImage(s, Math.floor(m.x), Math.floor(m.y+bob));
      // BOSS 区域着色
      if(m.isBoss){ c.globalAlpha=0.35; c.fillStyle=rg.color; c.fillRect(m.x,m.y,m.w,m.h); c.globalAlpha=1; }
      // 减速/灼烧标记
      if(m.slow>0){ c.fillStyle='rgba(110,198,255,0.4)'; c.fillRect(m.x,m.y,4,4); }
      if(m.burn>0){ c.fillStyle='rgba(255,112,67,0.5)'; c.fillRect(m.x+6,m.y,4,4); }
      if(m.isBoss){ c.fillStyle='#000'; c.globalAlpha=0.5; c.fillRect(m.x+4,m.y+m.h-2,m.w-8,4);
        c.fillStyle='#FF5252'; c.globalAlpha=1; c.fillRect(m.x+4,m.y+m.h-2,(m.w-8)*Utils.clamp(m.hp/m.maxHp,0,1),4);
        c.fillStyle='#fff'; c.font='12px "Courier New",monospace'; c.textAlign='center'; c.fillText(m.bossName||rg.bossName, m.x+m.w/2, m.y-8); c.textAlign='left'; }
      else if(m.type==='heavy'){ c.fillStyle='#000'; c.globalAlpha=0.5; c.fillRect(m.x+4,m.y+m.h-2,m.w-8,3);
        c.fillStyle='#4CAF50'; c.globalAlpha=1; c.fillRect(m.x+4,m.y+m.h-2,(m.w-8)*Utils.clamp(m.hp/m.maxHp,0,1),3); }
      c.restore(); } }
  renderProjs(){
    const c=this.r.ctx; const cam=this.r.cam;
    for(const pr of this.projs){ if(pr.x+20<cam.x||pr.x>cam.x+CONFIG.W+20||pr.y+20<cam.y||pr.y>cam.y+CONFIG.H+20) continue;
      // 拖尾
      for(let i=0;i<pr.trail.length-1;i++){ const t=pr.trail[i]; const a=(1-i/pr.trail.length)*0.35; c.globalAlpha=a; c.fillStyle=pr.color; c.fillRect(Math.floor(t.x-pr.s/2),Math.floor(t.y-pr.s/2),pr.s,pr.s); }
      c.globalAlpha=1;
      c.fillStyle=pr.color;
      if(pr.wtype==='blade'){ c.save(); c.translate(pr.x,pr.y); c.rotate(pr.life*14); c.fillRect(-pr.s,-2,pr.s*2,4); c.fillRect(-2,-pr.s,4,pr.s*2); c.restore(); }
      else if(pr.wtype==='ice'){ c.fillStyle='#E1F5FE'; c.fillRect(pr.x-3,pr.y-1,6,2); c.fillRect(pr.x-1,pr.y-3,2,6); c.fillStyle=pr.color; c.fillRect(pr.x-2,pr.y-2,4,4); }
      else if(pr.wtype==='chain'){ c.fillStyle='#FFF59D'; c.fillRect(pr.x-2,pr.y-3,4,6); c.fillStyle=pr.color; c.fillRect(pr.x-1,pr.y-1,2,2); }
      else { c.fillRect(Math.floor(pr.x-pr.s/2),Math.floor(pr.y-pr.s/2),pr.s,pr.s); }
    }
  }
  renderPlayer(){
    const p=this.player; if(!p.alive) return; const r=this.r;
    const heroKey=HEROES[p.heroId].sprite;
    const key=`${heroKey}_${p.state==='walk'?('walk'+(p.frame+1)):(p.state==='attack'?'attack':'idle')}`;
    let s=r.cache.get(key); if(!s) s=r.cache.get(heroKey+'_idle');
    const c=r.ctx; c.save();
    if(p.invincible>0 && Math.floor(p.invincible*12)%2===0) c.globalAlpha=0.45;
    c.translate(Math.floor(p.x),Math.floor(p.y));
    if(p.dir<0){ c.translate(p.w,0); c.scale(-1,1); }
    c.drawImage(s,0,0);
    // 武器图标（手部）
    const W=WEAPONS[p.weaponKey]; if(W&&W.icon){ const wi=r.cache.get(W.icon); if(wi) c.drawImage(wi, p.w-8, 8, 22,22); }
    c.restore();
    // 攻击轨迹（冲击波武器）
    if(W&&W.type==='shock'&&p.attackAnimT>0){ c.strokeStyle='rgba(207,216,220,'+(p.attackAnimT*4)+')'; c.lineWidth=5; c.beginPath(); c.arc(p.x+p.w/2,p.y+p.h/2,120*(1-p.attackAnimT*6),0,7); c.stroke(); }
  }
  // ---------- 画布点击：查看/交互 ----------
  canvasToWorld(e){
    const rect=this.canvas.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    const x=Utils.clamp(px/rect.width*CONFIG.W,0,CONFIG.W)+this.r.cam.x;
    const y=Utils.clamp(py/rect.height*CONFIG.H,0,CONFIG.H)+this.r.cam.y;
    return {x,y,px,py};
  }
  onCanvasClick(e){ if(this.mode!=='run'||this.state!=='playing') return; const w=this.canvasToWorld(e); this.inspectAt(w.x,w.y); }
  onCanvasTap(t){ if(this.mode!=='run'||this.state!=='playing') return; const w=this.canvasToWorld(t); this.inspectAt(w.x,w.y); }
  inspectAt(x,y){
    const p=this.player; const cx=p.x+p.w/2, cy=p.y+p.h/2;
    // 1) 拾取物：点击自动拾取
    for(const pk of this.pickups){ if(Utils.dist(pk.x,pk.y,x,y)<26){ this.collectPickup(pk);
      const nm={exp:'经验宝石',coin:'秘境币',heal:'治疗药水'}[pk.type]; const ds={exp:`拾取 +${pk.val} 经验`,coin:`拾取 +${pk.val} 金币`,heal:`拾取 +${pk.val} 生命`}[pk.type];
      this.showTooltip(nm,'拾取物',ds,{x:pk.x,y:pk.y}); this.pickups.splice(this.pickups.indexOf(pk),1); return; } }
    // 2) 场景物件：查看属性 / 破坏
    for(const o of this.objects){ if(!o.alive) continue; const box=o.getBox();
      if(x>=box.x-6 && x<=box.x+box.w+6 && y>=box.y-6 && y<=box.y+box.h+6){
        const meta=OBJECT_META[o.type]||{};
        if(o.type==='crate'||o.type==='pot'||o.type==='crystal'){ this.breakObject(o,true); return; }
        this.showTooltip(meta.name,meta.kind,meta.desc,{x:box.x+box.w/2,y:box.y}); return; } }
    // 3) 空白处：显示当前位置
    this.showTooltip('当前坐标',`${REGIONS[this.region].name} · 局部位置`,`X ${Math.floor(x)} · Y ${Math.floor(y)} · 长按/点击可查看物品`,{x,y});
  }
  showTooltip(name,kind,desc,worldPos){
    const el=this.$('tooltip');
    el.querySelector('.tt-name').textContent=name;
    el.querySelector('.tt-kind').textContent=kind;
    el.querySelector('.tt-desc').textContent=desc;
    // 世界坐标 → 屏幕位置（贴附在物件上方）
    const rect=this.canvas.getBoundingClientRect();
    const sx=(worldPos.x-this.r.cam.x)/CONFIG.W*rect.width, sy=(worldPos.y-this.r.cam.y)/CONFIG.H*rect.height;
    const cx=rect.left+sx, cy=rect.top+sy-30;
    el.style.left=Math.max(8,Math.min(window.innerWidth-200,cx-90))+'px';
    el.style.top=Math.max(8,cy)+'px';
    el.style.display='block';
    clearTimeout(this.tooltipTimer); this.tooltipTimer=setTimeout(()=>this.hideTooltip(),2200);
  }
  hideTooltip(){ this.$('tooltip').style.display='none'; }
  // ---------- 小地图（世界全图 + 实时局部定位 + 节流重绘） ----------
  renderMinimap(){
    if(this.mode!=='run') return;
    const now=performance.now();
    if(!this._mmT){ this._mmT=0; }
    // 每 0.18s 重绘一次，显著降低主线程负担（鼠标卡顿根因之一）
    if(now-this._mmT<180) return;
    this._mmT=now;
    const cv=this.$('minimap'); const c=cv.getContext('2d'); const MW=214,MH=134;
    const rg=REGIONS[this.region];
    c.fillStyle='rgba(6,10,18,0.82)'; c.fillRect(0,0,MW,MH);
    c.fillStyle=rg.color; c.globalAlpha=0.25; c.fillRect(2,2,MW-4,MH-4); c.globalAlpha=1;
    const kx=MW/CONFIG.WORLD_W, ky=MH/CONFIG.WORLD_H;
    // 物件
    c.fillStyle='#9aa'; for(const o of this.objects){ if(!o.alive) continue; c.fillRect(o.x*kx,o.y*ky,3,3); }
    // 拾取物
    c.fillStyle='#FFD740'; for(const pk of this.pickups){ c.fillRect(pk.x*kx,pk.y*ky,2,2); }
    // 怪物
    c.fillStyle='#ff5252'; for(const m of this.monsters){ c.fillRect(m.x*kx,m.y*ky,m.isBoss?5:2,m.isBoss?5:2); }
    // 玩家
    const p=this.player; const px=p.x*kx+p.w/2*kx, py=p.y*ky+p.h/2*ky;
    c.fillStyle='#fff'; c.fillRect(px-3,py-3,6,6); c.fillStyle='#FFD740'; c.fillRect(px-1,py-1,2,2);
    // 当前视口框（便于在大地图中定位自己）
    c.strokeStyle='rgba(255,255,255,0.65)'; c.lineWidth=1; c.strokeRect(this.r.cam.x*kx,this.r.cam.y*ky,CONFIG.W*kx,CONFIG.H*ky);
    c.strokeStyle='rgba(255,255,255,0.5)'; c.lineWidth=1; c.strokeRect(1,1,MW-2,MH-2);
    // 局部坐标刻度
    c.fillStyle='#668'; c.font='9px "Courier New",monospace';
    c.fillText(`${Math.floor(p.x)},${Math.floor(p.y)}`, 4, MH-4);
    // 区域气候标签
    this.$('minimap-label').innerHTML = `📍 ${rg.name}　${rg.temp>0?'+':''}${rg.temp}°C　湿度${rg.humid}%　${this.weatherName(rg.weather)}`;
  }
  // ---------- HUD ----------
  fmt(s){ const m=Math.floor(s/60), sec=Math.floor(s%60); return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
  updateHUD(){
    const p=this.player; this.$('hp-fill').style.width=(p.hp/p.maxHp*100)+'%';
    this.$('hud-level').textContent=p.level>=CONFIG.MAX_LEVEL?`${CONFIG.MAX_LEVEL}+`:`${p.level}`;
    this.$('hud-time').textContent=this.fmt(this.time);
    this.$('hud-coins').textContent=this.runCoins;
    const W=WEAPONS[p.weaponKey]; this.$('hud-weapon').textContent=W?W.name:'—';
    this.$('exp-fill').style.width=(p.exp/p.expNeed()*100)+'%';
  }
  toast(msg){ const el=this.$('toast'); el.textContent=msg; el.style.opacity=1; setTimeout(()=>{ el.style.opacity=0; },1800); }
  bossWarn(msg){ const el=this.$('boss-warn'); el.textContent=msg; el.style.opacity=1; setTimeout(()=>{ el.style.opacity=0; },2400); }
}

// ============================================================
// 启动
// ============================================================
window.addEventListener('DOMContentLoaded',()=>{
  const game=new Game(); window.__game=game; // 调试钩子：便于外部实时读取游戏状态
  const watched=Utils.storage.get(CONFIG.STORAGE.WATCHED,false) || /[?&]intro=0/.test(location.search) || /[?&]lvlup=1/.test(location.search);
  if(!watched){ setTimeout(()=>game.playStory(),300); }
  const unlock=()=>{ document.removeEventListener('click',unlock); document.removeEventListener('touchstart',unlock); };
  document.addEventListener('click',unlock); document.addEventListener('touchstart',unlock);
});
</script>
