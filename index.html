<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>炫酷飞机大战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            background-color: #050510;
            color: #fff;
            font-family: system-ui;
            overflow: hidden;
        }
        .wrap {
            max-width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
        }
        #gameCanvas {
            border: 1px solid #3366aa;
            background: #000;
            max-width: 100%;
        }
        .info-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            font-size: 16px;
        }
        button {
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .game-over-panel {
            position: absolute;
            background: rgba(0,0,0,0.88);
            border: 2px solid #4488ff;
            border-radius: 14px;
            text-align: center;
            padding: 40px 30px;
            color: #fff;
            display: none;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            width: 85%;
            max-width: 340px;
            z-index: 10;
        }
        .game-over-panel > div:nth-child(1) {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #ff6666;
        }
        .game-over-panel > div:nth-child(2) {
            font-size: 20px;
            margin-bottom: 24px;
        }
        #restartBtn {
            padding: 12px 30px;
            font-size: 18px;
            background: #2266dd;
            color: #fff;
            border: none;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
        }
        #restartBtn:active {
            background: #1144aa;
        }
        .canvas-wrap {
            position: relative;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="info-bar">
        <div>分数：<span id="score">0</span>｜生命：<span id="lifeCount">10</span></div>
        <div>
            <button id="audioToggle">音效:开</button>
        </div>
    </div>
    <div class="canvas-wrap">
        <canvas id="gameCanvas" width="480" height="720"></canvas>
        <div class="game-over-panel" id="gameOverUi">
            <div>游戏结束</div>
            <div>本次得分：<span id="finalScore">0</span></div>
            <button id="restartBtn">重新开始游戏</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');
const lifeDom = document.getElementById('lifeCount');
const audioToggleBtn = document.getElementById('audioToggle');
const gameOverUi = document.getElementById('gameOverUi');
const restartBtn = document.getElementById('restartBtn');
const finalScoreDom = document.getElementById('finalScore');

// 得分鼓动文字库
const scoreTextList = [
    { text: 'GREAT!', color: '#00ff88', size: 28 },
    { text: '超棒！', color: '#ffff00', size: 26 },
    { text: '连击击杀！', color: '#ff8800', size: 24 },
    { text: '完美命中！', color: '#44ddff', size: 24 },
    { text: '帅气！', color: '#ff44ff', size: 26 },
    { text: '火力全开！', color: '#ff6666', size: 28 },
    { text: 'NICE!', color: '#00ffff', size: 27 }
];
let floatTexts = [];

let audioCtx = null;
let audioEnable = true;

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playShootSound() {
    if (!audioEnable || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "square";
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}

function playExplodeSound() {
    if (!audioEnable || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.22);
}

function playGameOverSound() {
    if (!audioEnable || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
}

// 创建得分漂浮文字
function createScoreFloatText() {
    const randomText = scoreTextList[Math.floor(Math.random() * scoreTextList.length)];
    floatTexts.push({
        text: randomText.text,
        color: randomText.color,
        size: randomText.size,
        x: canvas.width / 2,
        y: canvas.height / 2 - 50,
        alpha: 1,
        speed: 2
    });
}

audioToggleBtn.onclick = () => {
    initAudio();
    audioEnable = !audioEnable;
    audioToggleBtn.innerText = audioEnable ? "音效:开" : "音效:关";
};

// 敌机改用原生绘制，不再依赖外部图片
const player = {
    x: canvas.width / 2 - 28,
    y: canvas.height - 100,
    w: 56,
    h: 56,
    speed: 8
};

let bullets = [];
let enemies = [];
let bossObstacles = [];
let score = 0;
let keys = {};
let gameRunning = true;
let playerLife = 10;

let lastShoot = 0;
const shootInterval = 280;
const MIN_ENEMY_SIZE = 70;
let bossTimer = 0;
const BOSS_INTERVAL = 5000;
const BOSS_SIZE = 90;
const BOSS_HP = 4;

// 代码雨背景
const codeChars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const fontSize = 14;
const columns = Math.floor(canvas.width / fontSize);
const drops = [];
for(let i = 0; i < columns; i++){
    drops[i] = Math.random() * -canvas.height;
}

function drawCodeRain(){
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${fontSize}px monospace`;
    for(let i = 0; i < drops.length; i++){
        const char = codeChars[Math.floor(Math.random() * codeChars.length)];
        ctx.fillStyle = '#00ff41';
        ctx.fillText(char, i * fontSize, drops[i]);
        if(Math.random() > 0.92){
            ctx.fillStyle = '#ffffff';
            ctx.fillText(char, i * fontSize, drops[i]);
        }
        if(drops[i] > canvas.height){
            drops[i] = Math.random() * -200;
        }
        drops[i] += 2;
    }
}

// 炫酷机甲飞机
function drawCoolPlayer(x, y, w, h) {
    ctx.save();
    const cx = x + w / 2;
    const cy = y + h / 2;
    const bodyGrad = ctx.createLinearGradient(cx, y, cx, y + h);
    bodyGrad.addColorStop(0, '#22ccff');
    bodyGrad.addColorStop(0.5, '#0066ff');
    bodyGrad.addColorStop(1, '#0022aa');

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(cx, y);
    ctx.lineTo(x + w - 8, y + h * 0.4);
    ctx.lineTo(x + w, y + h * 0.7);
    ctx.lineTo(x + w * 0.8, y + h);
    ctx.lineTo(x + w * 0.2, y + h);
    ctx.lineTo(x, y + h * 0.7);
    ctx.lineTo(x + 8, y + h * 0.4);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#88eeff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.moveTo(cx, y + 10);
    ctx.lineTo(x + w - 15, y + h * 0.45);
    ctx.lineTo(cx, y + h * 0.5);
    ctx.lineTo(x + 15, y + h * 0.45);
    ctx.closePath();
    ctx.fill();

    const cockpitGrad = ctx.createRadialGradient(cx, y + h * 0.3, 0, cx, y + h * 0.3, 12);
    cockpitGrad.addColorStop(0, '#ffffff');
    cockpitGrad.addColorStop(0.7, '#44ddff');
    cockpitGrad.addColorStop(1, '#0088cc');
    ctx.fillStyle = cockpitGrad;
    ctx.beginPath();
    ctx.ellipse(cx, y + h * 0.3, 10, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    const flameGrad = ctx.createLinearGradient(cx, y + h, cx, y + h + 20);
    flameGrad.addColorStop(0, '#ffff00');
    flameGrad.addColorStop(0.5, '#ff8800');
    flameGrad.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.moveTo(cx - 8, y + h);
    ctx.lineTo(cx, y + h + 15 + Math.random() * 5);
    ctx.lineTo(cx + 8, y + h);
    ctx.closePath();
    ctx.fill();

    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 15;
    ctx.restore();
}

function drawDefaultBullet(x, y, w, h) {
    ctx.save();
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.5, "#00ffff");
    grad.addColorStop(1, "#0088ff");
    ctx.fillStyle = grad;
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 15;
    ctx.fillRect(x, y, w, h);
    ctx.restore();
}

// 绘制得分文字
function drawFloatText() {
    floatTexts.forEach((item, index) => {
        ctx.save();
        ctx.globalAlpha = item.alpha;
        ctx.font = `bold ${item.size}px sans-serif`;
        ctx.fillStyle = item.color;
        ctx.textAlign = 'center';
        ctx.shadowColor = item.color;
        ctx.shadowBlur = 10;
        ctx.fillText(item.text, item.x, item.y);
        ctx.restore();
        item.y -= item.speed;
        item.alpha -= 0.02;
        if (item.alpha <= 0) floatTexts.splice(index, 1);
    });
}

function resetGame() {
    score = 0;
    scoreDom.innerText = score;
    playerLife = 10;
    lifeDom.innerText = playerLife;
    bullets = [];
    enemies = [];
    bossObstacles = [];
    bossTimer = 0;
    floatTexts = [];
    player.x = canvas.width / 2 - player.w / 2;
    player.y = canvas.height - 100;
    gameRunning = true;
    gameOverUi.style.display = "none";
}

function playerHit() {
    playerLife -= 1;
    lifeDom.innerText = playerLife;
    playExplodeSound();
    enemies = [];
    bossObstacles = [];
    player.x = canvas.width / 2 - player.w / 2;
    player.y = canvas.height - 100;
    if(playerLife <= 0) gameOver();
}

restartBtn.onclick = resetGame;

window.addEventListener("keydown", e => {
    keys[e.code] = true;
    initAudio();
    e.preventDefault();
});
window.addEventListener("keyup", e => keys[e.code] = false);

canvas.addEventListener("touchmove", e => {
    if (!gameRunning) return;
    initAudio();
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let tx = (touch.clientX - rect.left) * scaleX - player.w / 2;
    let ty = (touch.clientY - rect.top) * scaleY - player.h / 2;
    player.x = Math.max(0, Math.min(canvas.width - player.w, tx));
    player.y = Math.max(0, Math.min(canvas.height - player.h, ty));
});

function fireBullet() {
    bullets.push({
        x: player.x + player.w / 2 - 5,
        y: player.y - 12,
        w: 10,
        h: 20,
        speed: 12
    });
    playShootSound();
}

// 原生绘制敌机，不用外部图片
function spawnEnemy() {
    const size = Math.max(MIN_ENEMY_SIZE, 70 + Math.random() * 30);
    const x = Math.random() * (canvas.width - size);
    const hue = Math.random() * 360;
    enemies.push({
        x: x,
        y: -size,
        w: size,
        h: size,
        speed: 1.2 + Math.random() * 1.8,
        hit: false,
        rotation: 0,
        fallSpeed: 0,
        alpha: 1,
        hue: hue
    });
}

function spawnBoss() {
    const x = Math.random() * (canvas.width - BOSS_SIZE);
    bossObstacles.push({
        x: x,
        y: -BOSS_SIZE,
        w: BOSS_SIZE,
        h: BOSS_SIZE,
        speed: 0.7 + Math.random() * 0.6,
        hp: BOSS_HP,
        maxHp: BOSS_HP,
        phase: Math.floor(Math.random() * 3),
        time: 0,
        hit: false,
        rotation: 0,
        fallSpeed: 0,
        alpha: 1,
        hue: Math.random() * 360
    });
}

function isCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function drawBossBorder(boss) {
    const cx = boss.x + boss.w / 2;
    const cy = boss.y + boss.h / 2;
    const t = boss.time;
    ctx.save();
    if (boss.phase === 0) {
        ctx.strokeStyle = `hsl(${200 + Math.sin(t * 0.05) * 40}, 100%, 60%)`;
        ctx.lineWidth = 4;
        ctx.shadowColor = "#00ffff";
        ctx.shadowBlur = 15;
        ctx.beginPath();
        for (let i = 0; i <= 4; i++) {
            const angle = (i / 4) * Math.PI * 2 - Math.PI / 2;
            const x = cx + Math.cos(angle) * (boss.w / 2 + 8);
            const y = cy + Math.sin(angle) * (boss.h / 2 + 8);
            i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        }
        ctx.closePath(); ctx.stroke();
    } else if (boss.phase === 1) {
        const pulse = 1 + Math.sin(t * 0.08) * 0.15;
        ctx.strokeStyle = `hsl(${280 + t * 0.3}, 100%, 65%)`;
        ctx.lineWidth = 3;
        ctx.shadowColor = "#ff00ff";
        ctx.shadowBlur = 20 * pulse;
        ctx.beginPath();
        ctx.arc(cx, cy, boss.w / 2 + 10, 0, Math.PI * 2);
        ctx.stroke();
    } else {
        ctx.strokeStyle = "#ffdd00";
        ctx.lineWidth = 4;
        ctx.shadowColor = "#ffaa00";
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(cx, cy, boss.w / 2 + 10, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();
}

function drawBossHp(boss) {
    const barW = boss.w;
    const barH = 6;
    const x = boss.x;
    const y = boss.y - 10;
    ctx.fillStyle = "#333";
    ctx.fillRect(x, y, barW, barH);
    const hpW = (boss.hp / boss.maxHp) * barW;
    ctx.fillStyle = boss.hp > boss.maxHp / 2 ? "#00ff88" : "#ff4444";
    ctx.fillRect(x, y, hpW, barH);
}

function gameOver() {
    gameRunning = false;
    playGameOverSound();
    finalScoreDom.innerText = score;
    gameOverUi.style.display = "block";
}

function gameLoop(timeStamp) {
    if (gameRunning) {
        if (timeStamp - lastShoot > shootInterval) {
            fireBullet();
            lastShoot = timeStamp;
        }
        bossTimer += 16;
        if (bossTimer >= BOSS_INTERVAL) {
            spawnBoss();
            bossTimer = 0;
        }
    }
    drawCodeRain();
    drawFloatText();

    if (gameRunning) {
        if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
        if (keys["ArrowRight"] && player.x + player.w < canvas.width) player.x += player.speed;
        if (keys["ArrowUp"] && player.y > 0) player.y -= player.speed;
        if (keys["ArrowDown"] && player.y + player.h < canvas.height) player.y += player.speed;
    }

    drawCoolPlayer(player.x, player.y, player.w, player.h);

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (gameRunning) b.y -= b.speed;
        drawDefaultBullet(b.x, b.y, b.w, b.h);
        if (b.y < -30) bullets.splice(i, 1);
    }

    if (gameRunning && Math.random() < 0.010) spawnEnemy();

    // 普通敌机绘制
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (gameRunning && !e.hit) e.y += e.speed;
        if (e.hit) {
            e.rotation += 0.12;
            e.fallSpeed += 0.25;
            e.y += e.fallSpeed;
            e.alpha -= 0.018;
            if (e.alpha <= 0 || e.y > canvas.height + e.h) {
                enemies.splice(i, 1); continue;
            }
        }
        ctx.save();
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h / 2;
        ctx.translate(cx, cy);
        ctx.rotate(e.rotation);
        ctx.globalAlpha = e.alpha;
        ctx.fillStyle = `hsl(${e.hue},80%,50%)`;
        ctx.shadowColor = `hsl(${e.hue},80%,60%)`;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(0,-e.w/2);
        ctx.lineTo(-e.w/2,e.h/2);
        ctx.lineTo(e.w/2,e.h/2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        if (gameRunning && !e.hit) {
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                if (isCollide(b, e)) {
                    bullets.splice(j, 1);
                    score += 10;
                    scoreDom.innerText = score;
                    playExplodeSound();
                    e.hit = true;
                    createScoreFloatText();
                    break;
                }
            }
        }
        if (!e.hit && e.y > canvas.height) enemies.splice(i, 1);
        if (gameRunning && !e.hit && isCollide(player, e)) playerHit();
    }

    // Boss绘制
    for (let i = bossObstacles.length - 1; i >= 0; i--) {
        const boss = bossObstacles[i];
        boss.time += 1;
        if (gameRunning && !boss.hit) boss.y += boss.speed;
        if (boss.hit) {
            boss.rotation += 0.08;
            boss.fallSpeed += 0.18;
            boss.y += boss.fallSpeed;
            boss.alpha -= 0.012;
            if (boss.alpha <= 0 || boss.y > canvas.height + boss.h) {
                bossObstacles.splice(i, 1); continue;
            }
        }
        drawBossBorder(boss);
        if (!boss.hit) drawBossHp(boss);
        ctx.save();
        const cx = boss.x + boss.w / 2;
        const cy = boss.y + boss.h / 2;
        ctx.translate(cx, cy);
        ctx.rotate(boss.rotation);
        ctx.globalAlpha = boss.alpha;
        ctx.fillStyle = `hsl(${boss.hue},90%,45%)`;
        ctx.shadowColor = `hsl(${boss.hue},90%,60%)`;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(0,0,boss.w/2,0,Math.PI*2);
        ctx.fill();
        ctx.restore();

        if (gameRunning && !boss.hit) {
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                if (isCollide(b, boss)) {
                    bullets.splice(j, 1);
                    boss.hp -= 1;
                    playExplodeSound();
                    if (boss.hp <= 0) {
                        score += 50;
                        scoreDom.innerText = score;
                        boss.hit = true;
                        createScoreFloatText();
                        setTimeout(createScoreFloatText,100);
                    }
                    break;
                }
            }
        }
        if (!boss.hit && boss.y > canvas.height) bossObstacles.splice(i, 1);
        if (gameRunning && !boss.hit && isCollide(player, boss)) playerHit();
    }
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
