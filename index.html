<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飞机大战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            background-color: #050510;
            color: #fff;
            font-family: system-ui;
            overflow: hidden;
        }
        .wrap {
            max-width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
        }
        #gameCanvas {
            border: 1px solid #3366aa;
            background: #000;
            max-width: 100%;
        }
        .info-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            font-size: 16px;
        }
        button {
            padding: 4px 10px;
            font-size: 13px;
        }
        .game-over-panel {
            position: absolute;
            background: rgba(0,0,0,0.88);
            border: 2px solid #4488ff;
            border-radius: 14px;
            text-align: center;
            padding: 40px 30px;
            color: #fff;
            display: none;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            width: 85%;
            max-width: 340px;
        }
        .game-over-panel > div:nth-child(1) {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #ff6666;
        }
        .game-over-panel > div:nth-child(2) {
            font-size: 20px;
            margin-bottom: 24px;
        }
        #restartBtn {
            padding: 12px 30px;
            font-size: 18px;
            background: #2266dd;
            color: #fff;
            border: none;
            border-radius: 8px;
            width: 100%;
        }
        #restartBtn:active {
            background: #1144aa;
        }
        .canvas-wrap {
            position: relative;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="info-bar">
        <div>分数：<span id="score">0</span>｜生命：<span id="lifeCount">10</span></div>
        <div>
            <button id="audioToggle">音效:开</button>
            <button id="bgmToggle">BGM:关</button>
        </div>
    </div>
    <div class="canvas-wrap">
        <canvas id="gameCanvas" width="480" height="720"></canvas>
        <div class="game-over-panel" id="gameOverUi">
            <div>游戏结束</div>
            <div>本次得分：<span id="finalScore">0</span></div>
            <button id="restartBtn">重新开始游戏</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');
const lifeDom = document.getElementById('lifeCount');
const audioToggleBtn = document.getElementById('audioToggle');
const bgmToggleBtn = document.getElementById('bgmToggle');
const gameOverUi = document.getElementById('gameOverUi');
const restartBtn = document.getElementById('restartBtn');
const finalScoreDom = document.getElementById('finalScore');

// ====================== 障碍物图片路径 ======================
const ENEMY_IMAGE_PATHS = [
    "./picture/03FFD33897E4959340834CD3798C4B8A.jpg",
    "./picture/848ED1B74304625F63CAEE971B2A0D68.jpg",
    "./picture/9BC8CC7EA5C6A1A05730C1F56A18D74E.jpg",
    "./picture/A0CA6DFFD486F17173729BB7759486D5.jpg",
    "./picture/ABC3C278B03E8730B28F83762BC219C0.jpg",
    "./picture/5242989A46F108C0EB293F8CCD133625.jpg",
    "./picture/85714129BD4234654B89C3BE257B2171.jpg",
    "./picture/9CB91301E9895FCD3479AF3D3439F1D5.jpg",
    "./picture/A3E6623E0287F948DE1025FA3C2AF819.jpg",
    "./picture/FA34A8FF120F830B641D9EA504C69FBB.jpg"
];
// ===========================================================

let audioCtx = null;
let audioEnable = true;
let bgmEnable = false;
let bgmAudio = null;

// 鼓励文字数组
const praiseTexts = ["Great!", "Nice!", "Perfect!", "Amazing!", "Cool!", "Excellent!", "Bravo!"];
let praiseList = [];

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// 加载燃向BGM（可替换为你自己的音频链接）
function initBGM() {
    if (bgmAudio) return;
    bgmAudio = new Audio();
    // 这里替换成你的燃向BGM音频地址，支持mp3/wav
    bgmAudio.src = "https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3";
    bgmAudio.loop = true;
    bgmAudio.volume = 0.3;
}

function playShootSound() {
    if (!audioEnable || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "square";
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}

function playExplodeSound() {
    if (!audioEnable || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.22);
}

function playGameOverSound() {
    if (!audioEnable || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
}

// 添加鼓励文字
function addPraise(x, y) {
    const text = praiseTexts[Math.floor(Math.random() * praiseTexts.length)];
    praiseList.push({
        text: text,
        x: x,
        y: y,
        alpha: 1,
        offsetY: 0
    });
}

// 绘制鼓励文字
function drawPraise() {
    for (let i = praiseList.length - 1; i >= 0; i--) {
        const p = praiseList[i];
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.font = "bold 20px Arial";
        ctx.fillStyle = "#ffdd00";
        ctx.shadowColor = "#ff8800";
        ctx.shadowBlur = 6;
        ctx.fillText(p.text, p.x, p.y - p.offsetY);
        ctx.restore();

        p.offsetY += 1.2;
        p.alpha -= 0.015;
        if (p.alpha <= 0) {
            praiseList.splice(i, 1);
        }
    }
}

audioToggleBtn.onclick = () => {
    initAudio();
    audioEnable = !audioEnable;
    audioToggleBtn.innerText = audioEnable ? "音效:开" : "音效:关";
};

bgmToggleBtn.onclick = () => {
    initBGM();
    bgmEnable = !bgmEnable;
    bgmToggleBtn.innerText = bgmEnable ? "BGM:开" : "BGM:关";
    if (bgmEnable) {
        bgmAudio.play();
    } else {
        bgmAudio.pause();
    }
};

const res = {
    playerImg: null,
    enemyImgList: [],
    bulletImg: null,
    bgImg: null
};

function preloadEnemyImages(pathArray) {
    pathArray.forEach(path => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
            res.enemyImgList.push(img);
        };
        img.onerror = () => {
            console.warn("图片加载失败，请检查路径：", path);
        };
        img.src = path;
    });
}
preloadEnemyImages(ENEMY_IMAGE_PATHS);

const player = {
    x: canvas.width / 2 - 28,
    y: canvas.height - 100,
    w: 56,
    h: 56,
    speed: 8
};

let bullets = [];
let enemies = [];
let bossObstacles = [];
let score = 0;
let keys = {};
let gameRunning = true;
let playerLife = 10; // 玩家生命，10次试错机会

let lastShoot = 0;
const shootInterval = 280;

// 敌机最小尺寸
const MIN_ENEMY_SIZE = 70;

// Boss 相关
let bossTimer = 0;
const BOSS_INTERVAL = 5000; // Boss出现间隔拉长 5秒
const BOSS_SIZE = 90;
const BOSS_HP = 4;

// ===================== 代码雨背景新增 =====================
const codeChars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const fontSize = 14;
const columns = Math.floor(canvas.width / fontSize);
const drops = [];
// 初始化每列文字的y坐标
for(let i = 0; i < columns; i++){
    drops[i] = Math.random() * -canvas.height;
}

function drawCodeRain(){
    // 半透明黑色背景，实现拖影效果
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${fontSize}px monospace`;
    
    for(let i = 0; i < drops.length; i++){
        // 随机取字符
        const char = codeChars[Math.floor(Math.random() * codeChars.length)];
        // 主绿色高亮
        ctx.fillStyle = '#00ff41';
        ctx.fillText(char, i * fontSize, drops[i]);
        
        // 随机提亮部分字符
        if(Math.random() > 0.92){
            ctx.fillStyle = '#ffffff';
            ctx.fillText(char, i * fontSize, drops[i]);
        }

        // 文字下落，超出屏幕后重置到顶部
        if(drops[i] > canvas.height){
            drops[i] = Math.random() * -200;
        }
        drops[i] += 2;
    }
}
// ==========================================================

function resetGame() {
    score = 0;
    scoreDom.innerText = score;
    playerLife = 10;
    lifeDom.innerText = playerLife;
    bullets = [];
    enemies = [];
    bossObstacles = [];
    bossTimer = 0;
    praiseList = [];
    player.x = canvas.width / 2 - player.w / 2;
    player.y = canvas.height - 100;
    gameRunning = true;
    gameOverUi.style.display = "none";
}

// 玩家受到撞击，扣生命，不是直接结束游戏
function playerHit() {
    playerLife -= 1;
    lifeDom.innerText = playerLife;
    playExplodeSound();
    // 清除屏幕上所有敌机，给喘息
    enemies = [];
    bossObstacles = [];
    // 复位玩家位置
    player.x = canvas.width / 2 - player.w / 2;
    player.y = canvas.height - 100;
    if(playerLife <= 0){
        gameOver();
    }
}

restartBtn.onclick = resetGame;

window.addEventListener("keydown", e => {
    keys[e.code] = true;
    initAudio();
    e.preventDefault();
});
window.addEventListener("keyup", e => keys[e.code] = false);

canvas.addEventListener("touchmove", e => {
    if (!gameRunning) return;
    initAudio();
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let tx = (touch.clientX - rect.left) * scaleX - player.w / 2;
    let ty = (touch.clientY - rect.top) * scaleY - player.h / 2;
    player.x = Math.max(0, Math.min(canvas.width - player.w, tx));
    player.y = Math.max(0, Math.min(canvas.height - player.h, ty));
});

function fireBullet() {
    bullets.push({
        x: player.x + player.w / 2 - 5,
        y: player.y - 12,
        w: 10,
        h: 20,
        speed: 12
    });
    playShootSound();
}

function getRandomEnemyImage() {
    if (res.enemyImgList.length === 0) return null;
    const idx = Math.floor(Math.random() * res.enemyImgList.length);
    return res.enemyImgList[idx];
}

function spawnEnemy() {
    const size = Math.max(MIN_ENEMY_SIZE, 70 + Math.random() * 30);
    const x = Math.random() * (canvas.width - size);

    enemies.push({
        x: x,
        y: -size,
        w: size,
        h: size,
        speed: 1.2 + Math.random() * 1.8, // 普通敌机下降速度放慢
        img: getRandomEnemyImage(),
        hit: false,
        rotation: 0,
        fallSpeed: 0,
        alpha: 1
    });
}

function spawnBoss() {
    const x = Math.random() * (canvas.width - BOSS_SIZE);

    bossObstacles.push({
        x: x,
        y: -BOSS_SIZE,
        w: BOSS_SIZE,
        h: BOSS_SIZE,
        speed: 0.7 + Math.random() * 0.6, // Boss下降速度放慢
        hp: BOSS_HP,
        maxHp: BOSS_HP,
        phase: Math.floor(Math.random() * 3),
        time: 0,
        hit: false,
        rotation: 0,
        fallSpeed: 0,
        alpha: 1,
        img: getRandomEnemyImage()
    });
}

function isCollide(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

// 新版酷炫玩家飞机造型
function drawDefaultPlayer(x, y, w, h) {
    ctx.save();
    const cx = x + w / 2;
    const cy = y + h / 2;

    // 机身渐变
    const grad = ctx.createLinearGradient(cx, y, cx, y + h);
    grad.addColorStop(0, "#00e5ff");
    grad.addColorStop(0.6, "#0055ff");
    grad.addColorStop(1, "#7700ff");
    ctx.fillStyle = grad;
    ctx.shadowColor = "#00eeff";
    ctx.shadowBlur = 18;

    // 三角主机身
    ctx.beginPath();
    ctx.moveTo(cx, y);
    ctx.lineTo(x, y + h * 0.85);
    ctx.lineTo(cx - w * 0.35, y + h);
    ctx.lineTo(cx + w * 0.35, y + h);
    ctx.lineTo(x + w, y + h * 0.85);
    ctx.closePath();
    ctx.fill();

    // 机翼装饰
    ctx.fillStyle = "#ff44aa";
    ctx.beginPath();
    ctx.arc(cx, y + h * 0.6, 8, 0, Math.PI * 2);
    ctx.fill();

    // 尾焰喷射效果
    ctx.shadowBlur = 25;
    ctx.shadowColor = "#ffaa00";
    const flameGrad = ctx.createLinearGradient(cx, y + h, cx, y + h + 22);
    flameGrad.addColorStop(0, "#ffff00");
    flameGrad.addColorStop(1, "#ff2200");
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.moveTo(cx - 12, y + h);
    ctx.lineTo(cx, y + h + 22);
    ctx.lineTo(cx + 12, y + h);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawDefaultBullet(x, y, w, h) {
    ctx.save();
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.5, "#ffff00");
    grad.addColorStop(1, "#ff6600");
    ctx.fillStyle = grad;
    ctx.shadowColor = "#ffaa00";
    ctx.shadowBlur = 12;
    ctx.fillRect(x, y, w, h);
    ctx.restore();
}

function drawBossBorder(boss) {
    const cx = boss.x + boss.w / 2;
    const cy = boss.y + boss.h / 2;
    const t = boss.time;

    ctx.save();

    if (boss.phase === 0) {
        ctx.strokeStyle = `hsl(${200 + Math.sin(t * 0.05) * 40}, 100%, 60%)`;
        ctx.lineWidth = 4;
        ctx.shadowColor = "#00ffff";
        ctx.shadowBlur = 15;

        ctx.beginPath();
        for (let i = 0; i <= 4; i++) {
            const angle = (i / 4) * Math.PI * 2 - Math.PI / 2;
            const x = cx + Math.cos(angle) * (boss.w / 2 + 8);
            const y = cy + Math.sin(angle) * (boss.h / 2 + 8);

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        for (let i = 0; i <= 36; i++) {
            const angle = (i / 36) * Math.PI * 2;
            const wave = Math.sin(angle * 6 + t * 0.2) * 3;
            const r = boss.w / 2 + 12 + wave;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();

    } else if (boss.phase === 1) {
        const pulse = 1 + Math.sin(t * 0.08) * 0.15;

        ctx.strokeStyle = `hsl(${280 + t * 0.3}, 100%, 65%)`;
        ctx.lineWidth = 3;
        ctx.shadowColor = "#ff00ff";
        ctx.shadowBlur = 20 * pulse;

        ctx.beginPath();
        ctx.arc(cx, cy, boss.w / 2 + 10, 0, Math.PI * 2);
        ctx.stroke();

        ctx.shadowBlur = 10 * pulse;
        ctx.beginPath();
        ctx.arc(cx, cy, boss.w / 2 + 6, 0, Math.PI * 2);
        ctx.stroke();

    } else {
        ctx.strokeStyle = "#ffdd00";
        ctx.lineWidth = 4;
        ctx.shadowColor = "#ffaa00";
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.arc(cx, cy, boss.w / 2 + 10, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.shadowColor = "#ffff00";
        ctx.shadowBlur = 8;

        const scanAngle = t * 0.05;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(
            cx + Math.cos(scanAngle) * (boss.w / 2 + 16),
            cy + Math.sin(scanAngle) * (boss.w / 2 + 16)
        );
        ctx.stroke();
    }

    ctx.restore();
}

function drawBossHp(boss) {
    const barW = boss.w;
    const barH = 6;
    const x = boss.x;
    const y = boss.y - 10;

    ctx.fillStyle = "#333";
    ctx.fillRect(x, y, barW, barH);

    const hpW = (boss.hp / boss.maxHp) * barW;
    ctx.fillStyle = boss.hp > boss.maxHp / 2 ? "#00ff88" : "#ff4444";
    ctx.fillRect(x, y, hpW, barH);
}

function gameOver() {
    gameRunning = false;
    playGameOverSound();
    finalScoreDom.innerText = score;
    gameOverUi.style.display = "block";
}

function gameLoop(timeStamp) {
    if (gameRunning) {
        if (timeStamp - lastShoot > shootInterval) {
            fireBullet();
            lastShoot = timeStamp;
        }

        bossTimer += 16;
        if (bossTimer >= BOSS_INTERVAL) {
            spawnBoss();
            bossTimer = 0;
        }
    }

    // 替换原来的星空背景为代码雨
    drawCodeRain();
    // 绘制得分鼓励文字
    drawPraise();

    if (gameRunning) {
        if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
        if (keys["ArrowRight"] && player.x + player.w < canvas.width) player.x += player.speed;
        if (keys["ArrowUp"] && player.y > 0) player.y -= player.speed;
        if (keys["ArrowDown"] && player.y + player.h < canvas.height) player.y += player.speed;
    }

    drawDefaultPlayer(player.x, player.y, player.w, player.h);

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (gameRunning) b.y -= b.speed;
        drawDefaultBullet(b.x, b.y, b.w, b.h);
        if (b.y < -30) {
            bullets.splice(i, 1);
        }
    }

    if (gameRunning) {
        if (Math.random() < 0.010) { // 降低生成概率，障碍物生成变慢
            spawnEnemy();
        }
    }

    // 普通敌机逻辑
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        if (gameRunning && !e.hit) {
            e.y += e.speed;
        }

        if (e.hit) {
            e.rotation += 0.12;
            e.fallSpeed += 0.25;
            e.y += e.fallSpeed;
            e.alpha -= 0.018;

            if (e.alpha <= 0 || e.y > canvas.height + e.h) {
                enemies.splice(i, 1);
                continue;
            }
        }

        ctx.save();
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h / 2;
        ctx.translate(cx, cy);
        ctx.rotate(e.rotation);
        ctx.globalAlpha = e.alpha;

        // 只从图片中取，不画红色方块
        if (e.img) {
            ctx.drawImage(e.img, -e.w / 2, -e.h / 2, e.w, e.h);
        }

        ctx.restore();

        if (gameRunning && !e.hit) {
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                if (isCollide(b, e)) {
                    bullets.splice(j, 1);
                    score += 10;
                    scoreDom.innerText = score;
                    addPraise(e.x + e.w/2, e.y);
                    playExplodeSound();
                    e.hit = true;
                    break;
                }
            }
        }

        if (!e.hit && e.y > canvas.height) {
            enemies.splice(i, 1);
        }

        if (gameRunning && !e.hit && isCollide(player, e)) {
            playerHit(); // 撞击扣生命，不是直接结束
        }
    }

    // Boss 障碍物逻辑
    for (let i = bossObstacles.length - 1; i >= 0; i--) {
        const boss = bossObstacles[i];
        boss.time += 1;

        if (gameRunning && !boss.hit) {
            boss.y += boss.speed;
        }

        if (boss.hit) {
            boss.rotation += 0.08;
            boss.fallSpeed += 0.18;
            boss.y += boss.fallSpeed;
            boss.alpha -= 0.012;

            if (boss.alpha <= 0 || boss.y > canvas.height + boss.h) {
                bossObstacles.splice(i, 1);
                continue;
            }
        }

        drawBossBorder(boss);

        if (!boss.hit) {
            drawBossHp(boss);
        }

        ctx.save();
        const cx = boss.x + boss.w / 2;
        const cy = boss.y + boss.h / 2;
        ctx.translate(cx, cy);
        ctx.rotate(boss.rotation);
        ctx.globalAlpha = boss.alpha;

        // 只从图片中取，不画红色方块
        if (boss.img) {
            ctx.drawImage(boss.img, -boss.w / 2, -boss.w / 2, boss.w, boss.h);
        }

        ctx.restore();

        if (gameRunning && !boss.hit) {
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                if (isCollide(b, boss)) {
                    bullets.splice(j, 1);
                    boss.hp -= 1;
                    playExplodeSound();

                    if (boss.hp <= 0) {
                        score += 50;
                        scoreDom.innerText = score;
                        addPraise(boss.x + boss.w/2, boss.y);
                        boss.hit = true;
                    }
                    break;
                }
            }
        }

        if (!boss.hit && boss.y > canvas.height) {
            bossObstacles.splice(i, 1);
        }

        if (gameRunning && !boss.hit && isCollide(player, boss)) {
            playerHit(); // Boss撞击扣生命
        }
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
